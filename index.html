<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore available, pending, and sold AcreTown properties on an interactive map.">
  <title>AcreTown Property Map</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #1e6d45;
      --brand-dark: #164f34;
      --brand-soft: #eaf5ee;
      --ink: #15231b;
      --muted: #607067;
      --line: #dbe4de;
      --panel: #ffffff;
      --page: #f5f8f6;
      --available: #168a4b;
      --pending: #d99800;
      --sold: #cf3e3e;
      --shadow: 0 16px 40px rgba(20, 53, 35, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button, select, input[type="search"] { min-height: 42px; }
    button, label, select { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1720px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .intro-copy {
      max-width: 580px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .inventory-note {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .inventory-note::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--available);
      box-shadow: 0 0 0 4px rgba(22, 138, 75, 0.12);
      content: "";
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(210px, 1.25fr) auto repeat(3, minmax(135px, 0.55fr)) auto;
      align-items: end;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      background: var(--panel);
    }

    .field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid #c9d4cc;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
      padding: 9px 11px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
    }

    .field input:focus,
    .field select:focus,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(30, 109, 69, 0.25);
      outline-offset: 2px;
      border-color: var(--brand);
    }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 286px;
      margin: 0;
      border: 0;
      padding: 0 0 1px;
    }

    .status-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 8px 11px;
      color: #536158;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      user-select: none;
    }

    .status-toggle:has(input:checked) {
      border-color: #a9c8b5;
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .status-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .status-toggle:has(input:focus-visible) {
      outline: 3px solid rgba(30, 109, 69, 0.25);
      outline-offset: 2px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(21, 35, 27, 0.18);
    }

    .status-dot.available { background: var(--available); }
    .status-dot.pending { background: var(--pending); }
    .status-dot.sold { background: var(--sold); }

    .reset-button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--brand-dark);
      padding: 9px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }

    .reset-button:hover { background: var(--brand-soft); }

    .mobile-tabs {
      display: none;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #fff;
      padding: 10px;
      gap: 8px;
    }

    .mobile-tab {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
    }

    .mobile-tab[aria-selected="true"] {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .map-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      height: clamp(580px, 73vh, 760px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0 0 var(--radius) var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .map-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #dce9df;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-state {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(245, 248, 246, 0.9);
      backdrop-filter: blur(3px);
    }

    .map-state[hidden] { display: none; }

    .state-card {
      width: min(390px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 22px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(21, 35, 27, 0.14);
    }

    .state-spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 13px;
      border: 3px solid #d7e7dc;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .state-card p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .retry-button {
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 9px 15px;
      cursor: pointer;
      font-weight: 800;
    }

    .results-panel {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: #fff;
    }

    .results-header {
      display: grid;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .results-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .result-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }

    .result-sort {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .result-sort select {
      width: 100%;
      min-height: 34px;
      border: 1px solid #c9d4cc;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      outline: none;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: normal;
      text-transform: none;
    }

    .result-sort select:focus {
      border-color: var(--brand);
      outline: 3px solid rgba(30, 109, 69, 0.2);
      outline-offset: 1px;
    }

    .results-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 10px;
      scrollbar-gutter: stable;
    }

    .property-card {
      overflow: hidden;
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .property-card:hover {
      border-color: #9bc3aa;
      box-shadow: 0 8px 20px rgba(30, 109, 69, 0.11);
      transform: translateY(-1px);
    }

    .property-card.is-active {
      border-color: var(--brand);
      background: #f1f8f4;
      box-shadow: 0 0 0 2px rgba(30, 109, 69, 0.12), 0 10px 24px rgba(30, 109, 69, 0.16);
    }

    .property-card.is-active .property-card-main { background: #f1f8f4; }

    .property-card.is-highlighting {
      animation: property-card-highlight 760ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes property-card-highlight {
      0% {
        box-shadow: 0 0 0 0 rgba(30, 109, 69, 0.38), 0 10px 24px rgba(30, 109, 69, 0.16);
      }
      70% {
        box-shadow: 0 0 0 9px rgba(30, 109, 69, 0), 0 10px 24px rgba(30, 109, 69, 0.16);
      }
      100% {
        box-shadow: 0 0 0 2px rgba(30, 109, 69, 0.12), 0 10px 24px rgba(30, 109, 69, 0.16);
      }
    }

    .property-card-main {
      display: grid;
      width: 100%;
      min-height: 0;
      grid-template-columns: 105px minmax(0, 1fr);
      border: 0;
      background: #fff;
      color: inherit;
      padding: 0;
      text-align: left;
      cursor: pointer;
      transition: background-color 180ms ease;
    }

    .property-thumb {
      position: relative;
      height: 100%;
      min-height: 112px;
      overflow: hidden;
      background: #dfe9e2;
    }

    .property-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .property-thumb-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #617169;
      font-size: 12px;
      font-weight: 800;
    }

    .property-card-body {
      min-width: 0;
      padding: 11px 12px 9px;
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-price {
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .property-card h3 {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 13px;
      line-height: 1.35;
    }

    .card-meta {
      display: -webkit-box;
      overflow: hidden;
      margin: 6px 0 0;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 11px;
      line-height: 1.35;
    }

    .card-link {
      display: block;
      border-top: 1px solid var(--line);
      color: var(--brand);
      padding: 8px 12px;
      text-align: right;
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
    }

    .card-link:hover { background: var(--brand-soft); }

    .empty-results {
      display: grid;
      min-height: 240px;
      place-items: center;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .mobile-property-sheet {
      position: absolute;
      z-index: 10;
      bottom: 38px;
      left: 50%;
      width: min(720px, calc(100% - 32px));
      max-height: min(38%, 240px);
      overflow: auto;
      border: 1px solid rgba(219, 228, 222, 0.96);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.98);
      padding: 12px 48px 12px 12px;
      box-shadow: 0 18px 45px rgba(20, 53, 35, 0.24);
      overscroll-behavior: contain;
      transform: translateX(-50%);
      -webkit-overflow-scrolling: touch;
    }

    .mobile-property-preview {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 12px;
      color: var(--ink);
    }

    .mobile-property-photo {
      position: relative;
      min-height: 96px;
      overflow: hidden;
      border-radius: 12px;
      background: #dfe9e2;
    }

    .mobile-property-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mobile-property-body { min-width: 0; }

    .mobile-property-preview h3 {
      display: -webkit-box;
      overflow: hidden;
      margin: 5px 0 4px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 14px;
      line-height: 1.3;
    }

    .mobile-property-address {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 12px;
      line-height: 1.35;
    }

    .mobile-property-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-top: 8px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 850;
      text-decoration: none;
    }

    .mobile-property-link:hover { background: var(--brand-dark); }

    .mobile-property-close {
      position: absolute;
      z-index: 1;
      top: 8px;
      right: 8px;
      display: grid;
      width: 36px;
      min-height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      box-shadow: 0 4px 12px rgba(20, 53, 35, 0.12);
    }

    .mobile-property-close:hover { background: var(--brand-soft); }

    /* In a desktop page or iframe, keep the complete experience inside the
       available viewport. The map receives whatever height remains after the
       title and filters instead of forcing the outer page to scroll. */
    @media (min-width: 821px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      .app {
        display: grid;
        width: min(1720px, 100%);
        height: 100vh;
        height: 100dvh;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }

      .map-shell {
        min-height: 0;
        height: auto;
      }
    }

    @media (max-width: 1280px) {
      .toolbar {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .search-field { grid-column: 1 / 3; }
      .status-group { grid-column: 3 / 5; }
      .reset-button { grid-column: 4; }
      .map-shell { grid-template-columns: minmax(0, 1fr) 340px; }
    }

    @media (max-width: 820px) {
      .app { padding: 12px; }
      .intro { align-items: start; flex-direction: column; gap: 8px; }
      .inventory-note { margin-bottom: 0; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .search-field, .status-group { grid-column: 1 / -1; }
      .status-group { min-width: 0; }
      .acreage-field { grid-column: 1 / -1; }
      .reset-button { grid-column: 1 / -1; }
      .mobile-tabs { display: flex; }
      .map-shell {
        display: block;
        height: clamp(500px, 70vh, 680px);
      }
      .map-panel, .results-panel { width: 100%; height: 100%; }
      .results-panel { border-left: 0; }
      .app[data-mobile-view="map"] .results-panel { display: none; }
      .app[data-mobile-view="list"] .map-panel { display: none; }
      .results-list { padding: 12px; }
      .mobile-property-sheet {
        right: 12px;
        bottom: 12px;
        left: 12px;
        width: auto;
        transform: none;
      }
    }

    @media (max-width: 480px) {
      .app { padding: 0; }
      .intro { padding: 16px 16px 12px; }
      .intro-copy { font-size: 13px; }
      .toolbar { border-right: 0; border-left: 0; border-radius: 0; padding: 12px; }
      .mobile-tabs { border-right: 0; border-left: 0; }
      .map-shell { border-right: 0; border-left: 0; border-radius: 0; box-shadow: none; }
      .status-toggle { flex: 1 1 auto; justify-content: center; }
      .property-card-main { grid-template-columns: 96px minmax(0, 1fr); }
      .mobile-property-sheet {
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        left: 8px;
        width: auto;
        max-height: min(38%, 220px);
        transform: none;
      }
      .mobile-property-preview { grid-template-columns: minmax(0, 1fr); }
      .mobile-property-photo { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="property-app" data-mobile-view="map">
    <header class="intro">
      <div>
        <p class="eyebrow">AcreTown Properties</p>
        <h1>Find your piece of land</h1>
        <p class="intro-copy">Search live inventory, narrow it by status, price, or acreage, and select any property for details.</p>
      </div>
      <div class="inventory-note">Live inventory</div>
    </header>

    <section class="toolbar" aria-label="Property filters">
      <label class="field search-field" for="property-search">
        Search
        <input id="property-search" type="search" placeholder="Search by State / County / City / ZIP or Address" autocomplete="off" list="property-search-suggestions">
        <datalist id="property-search-suggestions"></datalist>
      </label>

      <fieldset class="status-group" aria-label="Show property statuses">
        <legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Show statuses</legend>
        <label class="status-toggle">
          <input type="checkbox" value="available" data-status-filter checked>
          <span class="status-dot available" aria-hidden="true"></span>
          Available
        </label>
        <label class="status-toggle">
          <input type="checkbox" value="pending" data-status-filter checked>
          <span class="status-dot pending" aria-hidden="true"></span>
          Pending
        </label>
        <label class="status-toggle">
          <input type="checkbox" value="sold" data-status-filter checked>
          <span class="status-dot sold" aria-hidden="true"></span>
          Sold
        </label>
      </fieldset>

      <label class="field" for="price-min">
        Minimum price
        <select id="price-min"><option value="0">No minimum</option></select>
      </label>

      <label class="field" for="price-max">
        Maximum price
        <select id="price-max"><option value="Infinity">No maximum</option></select>
      </label>

      <label class="field acreage-field" for="acreage-range">
        Acreage
        <select id="acreage-range">
          <option value="any">Any acreage</option>
          <option value="0-1">Under 1 acre</option>
          <option value="1-5">1–5 acres</option>
          <option value="5-10">5–10 acres</option>
          <option value="10-20">10–20 acres</option>
          <option value="20-50">20–50 acres</option>
          <option value="50-Infinity">50+ acres</option>
        </select>
      </label>

      <button class="reset-button" id="reset-filters" type="button">Reset filters</button>
    </section>

    <div class="mobile-tabs" role="tablist" aria-label="Property display">
      <button class="mobile-tab" id="map-tab" type="button" role="tab" aria-selected="true" aria-controls="map-panel">Map</button>
      <button class="mobile-tab" id="list-tab" type="button" role="tab" aria-selected="false" aria-controls="results-panel">List</button>
    </div>

    <section class="map-shell">
      <section class="map-panel" id="map-panel" role="tabpanel" aria-labelledby="map-tab">
        <div id="map" role="region" aria-label="Interactive property map"></div>
        <section class="mobile-property-sheet" id="mobile-property-sheet" aria-label="Selected property preview" hidden>
          <button class="mobile-property-close" id="mobile-property-close" type="button" aria-label="Close property details">&times;</button>
          <div id="mobile-property-content"></div>
        </section>
        <div class="map-state" id="map-state" role="status" aria-live="polite">
          <div class="state-card">
            <div class="state-spinner" id="state-spinner" aria-hidden="true"></div>
            <h2 id="state-title">Loading properties…</h2>
            <p id="state-message">Connecting to the live inventory.</p>
            <button class="retry-button" id="retry-button" type="button" hidden>Try again</button>
          </div>
        </div>
      </section>

      <aside class="results-panel" id="results-panel" role="tabpanel" aria-labelledby="list-tab">
        <div class="results-header">
          <div class="results-heading-row">
            <h2>Properties</h2>
            <div class="result-count" id="result-count" aria-live="polite">Loading…</div>
          </div>
          <label class="result-sort" for="property-sort">
            <span>Sort</span>
            <select id="property-sort">
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>

      const CAMERA_FRAME_INTERVAL = 1000 / 60;

      function decodeEntities(value) {
        const namedEntities = {
          amp: "&",
          apos: "'",
          gt: ">",
          lt: "<",
          nbsp: "\u00a0",
          quot: "\""
        };
        return String(value ?? "").replace(
          /&#(\d+);|&#x([0-9a-f]+);|&(amp|apos|gt|lt|nbsp|quot);/gi,
          (match, decimal, hexadecimal, named) => {
            if (named) return namedEntities[named.toLowerCase()] ?? match;
            const codePoint = Number.parseInt(decimal || hexadecimal, decimal ? 10 : 16);
            return Number.isInteger(codePoint) && codePoint >= 0 && codePoint <= 0x10ffff
              ? String.fromCodePoint(codePoint)
              : match;
          }
        );
      }

      function safeHttpUrl(value) {
        if (!value) return null;
        try {
          const url = new URL(String(value), window.location.href);
          return ["http:", "https:"].includes(url.protocol) ? url.href : null;
        } catch {
          return null;
        }
      }

      function formatPrice(value) {
        if (value === null || value === undefined || String(value).trim() === "") {
          return "Price unavailable";
        }
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return "Price unavailable";
        return numeric.toLocaleString("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0
        });
      }

      function parsePrice(value) {
        if (typeof value === "number" && Number.isFinite(value)) return value;
        const cleaned = String(value ?? "").replace(/[$,\s]/g, "");
        if (!cleaned) return null;
        const numeric = Number(cleaned);
        return Number.isFinite(numeric) ? numeric : null;
      }

      function normalizeStatus(rawStatus) {
        const normalized = String(rawStatus ?? "").trim().toLowerCase();
        if (normalized.startsWith("sold")) return "sold";
        if (normalized === "pending" || normalized.startsWith("sale pending")) return "pending";
        if (normalized === "available" || normalized.startsWith("full marketing") || normalized.startsWith("basic marketing")) return "available";
        return null;
      }

      function normalizeSearchText(value) {
        const normalized = String(value ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim()
          .replace(/\s+/g, " ");
        return normalized
          .split(" ")
          .filter(Boolean)
          .map(word => SEARCH_WORD_ALIASES[word] ?? word)
          .join(" ");
      }

      function extractStateCode(...values) {
        for (const value of values) {
          const matches = String(value ?? "").matchAll(/,\s*([A-Z]{2})(?=\s|\d|$)/g);
          for (const match of matches) {
            if (STATE_NAMES[match[1]]) return match[1];
          }
        }
        return "";
      }

      function cellValue(row, index, formatted = false) {
        const cell = row?.c?.[index];
        if (!cell) return "";
        if (formatted && cell.f != null) return cell.f;
        return cell.v ?? "";
      }

      function parseGvizResponse(text) {
        const prefix = "google.visualization.Query.setResponse(";
        const start = text.indexOf(prefix);
        const end = text.lastIndexOf(");");
        if (start === -1 || end === -1 || end <= start) {
          throw new Error("The inventory response was not recognized.");
        }
        return JSON.parse(text.slice(start + prefix.length, end));
      }

      async function fetchSheetRows({ sheetId, gid, sheetName }) {
        const sheetSelector = sheetName
          ? `&sheet=${encodeURIComponent(sheetName)}`
          : `&gid=${encodeURIComponent(gid)}`;
        const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq?tqx=out:json${sheetSelector}`;
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`Inventory request failed (${response.status}).`);
        const payload = parseGvizResponse(await response.text());
        if (payload.status && payload.status !== "ok") throw new Error("The inventory source returned an error.");
        return payload.table?.rows ?? [];
      }

      function rowToProperty(row, index) {
        const rawStatus = decodeEntities(cellValue(row, 0));
        const status = normalizeStatus(rawStatus);
        const title = decodeEntities(cellValue(row, 1)).trim();
        const address = decodeEntities(cellValue(row, 3)).trim();
        const rawLat = cellValue(row, 5);
        const rawLng = cellValue(row, 6);
        const link = safeHttpUrl(cellValue(row, 7));
        const coordinateOverride = COORDINATE_OVERRIDES.find(override => (
          override.link === link
          && normalizeSearchText(override.address) === normalizeSearchText(address)
        ));
        if (String(rawLat).trim() === "" || String(rawLng).trim() === "") return null;
        const lat = coordinateOverride?.lat ?? Number(rawLat);
        const lng = coordinateOverride?.lng ?? Number(rawLng);
        if (!status || !Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
          return null;
        }

        const numericPrice = parsePrice(cellValue(row, 2));
        const numericAcres = Number(cellValue(row, 4));
        const acresLabel = decodeEntities(cellValue(row, 4, true)) || (Number.isFinite(numericAcres) ? String(numericAcres) : "Not listed");
        const stateCode = extractStateCode(address, title);
        const stateName = STATE_NAMES[stateCode] ?? "";

        return {
          id: `property-${index}`,
          status,
          statusLabel: STATUS_META[status].label,
          title: title || address || "Property",
          price: numericPrice,
          priceLabel: formatPrice(numericPrice),
          address: address || "Address unavailable",
          acres: Number.isFinite(numericAcres) ? numericAcres : null,
          acresLabel,
          stateCode,
          stateName,
          searchText: normalizeSearchText(`${title} ${address} ${STATUS_META[status].label} ${acresLabel} ${stateCode} ${stateName}`),
          lat,
          lng,
          link,
          photo: safeHttpUrl(cellValue(row, 8)),
          marker: null
        };
      }

      function deduplicateProperties(items) {
        const uniqueProperties = new Map();
        items.forEach(property => {
          const identity = [
            normalizeSearchText(property.title),
            normalizeSearchText(property.address),
            normalizeSearchText(property.acresLabel),
            property.link
          ].join("|");
          uniqueProperties.set(identity, property);
        });
        return [...uniqueProperties.values()];
      }

      function createTextElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text;
        return element;
      }

      function createStatusBadge(property) {
        const badge = document.createElement("span");

      }

      function makePropertyImage(property, className) {
        const wrapper = document.createElement("div");
        wrapper.className = className;
        const fallback = createTextElement("span", "property-thumb-fallback", "AcreTown");
        wrapper.appendChild(fallback);

          const image = document.createElement("img");

          image.alt = `Featured view of ${property.title}`;

        }

      function buildMobilePropertyPreview(property) {
        const container = document.createElement("div");
        container.className = "mobile-property-preview";

        if (property.photo) {
          container.appendChild(makePropertyImage(property, "mobile-property-photo"));

        const body = document.createElement("div");

        body.append(topLine, createTextElement("h3", "", property.title));

      function clearActiveCard() {
        window.clearTimeout(propertyHighlightTimer);
        propertyHighlightTimer = 0;
        resultsList.querySelectorAll(".property-card.is-active, .property-card.is-highlighting").forEach(card => {
          card.classList.remove("is-active", "is-highlighting");

      }

      function highlightPropertyCard(property, { scroll = true } = {}) {
        clearActiveCard();
        const card = resultsList.querySelector(`[data-property-id="${property.id}"]`);
        if (!card) return;

        card.classList.add("is-active", "is-highlighting");

      function isCompactMapView() {
        return window.matchMedia("(max-width: 820px)").matches;

      function hideMobilePropertySheet() {
        mobilePropertySheet.hidden = true;

      function showPropertyDetails(property) {

      function closePropertyDetails({ clearSelection = true } = {}) {

      function syncPropertyDetailsSurface() {

      function openProperty(property, { focusMap = false, pan = true, scrollCard = true } = {}) {
        selectedPropertyId = property.id;
        showPropertyDetails(property);

        if (focusMap) {

      function createMarker(property) {
        const meta = STATUS_META[property.status];
        const pin = new PinClass({
          background: meta.color,
          borderColor: meta.border,
          glyphColor: "#ffffff",
          scale: property.status === "sold" ? 0.84 : 0.94
        });
        const marker = new MarkerClass({

        property.marker = marker;
      }

      function appendSelectOption(select, value, label) {
        const option = document.createElement("option");
        option.value = String(value);
        option.textContent = label;
        select.appendChild(option);
      }

      function configurePriceFilters() {
        const finitePrices = properties.map(property => property.price).filter(Number.isFinite);
        const highestPrice = finitePrices.length ? Math.max(...finitePrices) : 0;
        PRICE_STEPS.filter(value => value <= highestPrice).forEach(value => {
          appendSelectOption(minPriceSelect, value, formatPrice(value));
          appendSelectOption(maxPriceSelect, value, formatPrice(value));
        });
        if (highestPrice > 0 && !PRICE_STEPS.includes(highestPrice)) {
          const roundedCeiling = Math.ceil(highestPrice / 100000) * 100000;
          if (![...maxPriceSelect.options].some(option => Number(option.value) === roundedCeiling)) {
            appendSelectOption(maxPriceSelect, roundedCeiling, formatPrice(roundedCeiling));
          }
        }
      }

      function configureSearchSuggestions() {
        const suggestionMap = new Map();
        const addSuggestion = value => {
          const label = String(value ?? "").trim();
          const key = normalizeSearchText(label);
          if (key.length >= 2 && !suggestionMap.has(key)) suggestionMap.set(key, label);
        };

        properties.forEach(property => {
          addSuggestion(property.title.split("|")[0]);
          // Keep ZIP codes searchable through property.searchText, but do not
          // surface them in the autocomplete menu.
          addSuggestion(property.address.replace(/\s+\d{5}(?:-\d{4})?\s*$/, ""));
          addSuggestion(property.stateName);

          const addressParts = property.address.split(",").map(part => part.trim()).filter(Boolean);
          if (addressParts.length >= 2) {
            const city = addressParts[addressParts.length - 2];
            addSuggestion(property.stateName ? `${city}, ${property.stateName}` : city);
          }

        });

        const fragment = document.createDocumentFragment();
        [...suggestionMap.values()]
          .sort((a, b) => a.localeCompare(b))
          .forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            fragment.appendChild(option);
          });
        searchSuggestions.replaceChildren(fragment);
      }

      function selectedStatuses() {
        return new Set(
          [...document.querySelectorAll("[data-status-filter]:checked")].map(input => input.value)
        );
      }

      function filteredInventory() {
        const statuses = selectedStatuses();
        const minPrice = Number(minPriceSelect.value);
        const maxPrice = maxPriceSelect.value === "Infinity" ? Infinity : Number(maxPriceSelect.value);
        const acreageRange = acreageSelect.value === "any"
          ? null
          : acreageSelect.value.split("-").map(value => value === "Infinity" ? Infinity : Number(value));
        const queryTokens = normalizeSearchText(searchInput.value).split(" ").filter(Boolean);

        return properties.filter(property => {
          if (!statuses.has(property.status)) return false;
          if (Number.isFinite(property.price) && (property.price < minPrice || property.price > maxPrice)) return false;
          if (!Number.isFinite(property.price) && (minPrice > 0 || Number.isFinite(maxPrice))) return false;
          if (acreageRange) {
            if (!Number.isFinite(property.acres)) return false;
            const [minimumAcres, maximumAcres] = acreageRange;
            if (property.acres < minimumAcres || property.acres >= maximumAcres) return false;
          }
          if (!queryTokens.length) return true;
          const propertyWords = new Set(property.searchText.split(" "));
          return queryTokens.every(token => (
            token.length <= 2
              ? propertyWords.has(token)
              : property.searchText.includes(token)
          ));
        });
      }

      function sortProperties(items) {
        const mode = sortSelect.value;
        const field = mode.startsWith("acres") ? "acres" : "price";
        const direction = mode.endsWith("desc") ? -1 : 1;

        return [...items].sort((a, b) => {
          const aValue = a[field];
          const bValue = b[field];
          const aHasValue = Number.isFinite(aValue);
          const bHasValue = Number.isFinite(bValue);
          if (aHasValue !== bHasValue) return aHasValue ? -1 : 1;
          if (aHasValue && bHasValue && aValue !== bValue) return (aValue - bValue) * direction;
          const statusDifference = STATUS_META[a.status].rank - STATUS_META[b.status].rank;
          if (statusDifference) return statusDifference;
          return a.title.localeCompare(b.title);
        });
      }

      function renderResults(items, { inView = false } = {}) {
        resultsList.replaceChildren();
        resultCount.textContent = `${items.length.toLocaleString()} ${items.length === 1 ? "property" : "properties"}${inView ? " in view" : ""}`;

        if (!items.length) {
          const empty = createTextElement(
            "div",
            "empty-results",
            inView
              ? "No matching properties are visible here. Pan or zoom out to see more."
              : "No properties match these filters. Try a broader search, price range, acreage, or status."
          );
          resultsList.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        sortProperties(items).forEach(property => {
          const card = document.createElement("article");
          card.className = "property-card";
          card.dataset.propertyId = property.id;
          if (property.id === selectedPropertyId) card.classList.add("is-active");

          const main = document.createElement("button");
          main.className = "property-card-main";
          main.type = "button";
          main.setAttribute("aria-label", `Show ${property.title} on the map`);
          main.setAttribute("aria-pressed", String(property.id === selectedPropertyId));
          main.addEventListener("click", () => {
            selectedPropertyId = property.id;
            setMobileView("map");
            requestAnimationFrame(() => openProperty(property, { focusMap: true, scrollCard: false }));
          });

          main.appendChild(makePropertyImage(property, "property-thumb"));
          const body = document.createElement("div");
          body.className = "property-card-body";
          const topLine = document.createElement("div");
          topLine.className = "card-topline";
          topLine.append(createStatusBadge(property), createTextElement("span", "card-price", property.priceLabel || formatPrice(property.price)));
          body.append(topLine, createTextElement("h3", "", property.title));
          body.appendChild(createTextElement("p", "card-meta", property.address));
          main.appendChild(body);
          card.appendChild(main);

          if (property.link) {
            const link = createTextElement("a", "card-link", "View property ↗");
            link.href = property.link;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            card.appendChild(link);
          }
          fragment.appendChild(card);
        });
        resultsList.appendChild(fragment);
      }

      function buildBounds(items) {
        const bounds = new google.maps.LatLngBounds();
        items.forEach(property => bounds.extend({ lat: property.lat, lng: property.lng }));
        return bounds;
      }

      function renderViewportResults() {
        if (!map || !visibleProperties.length) {
          renderResults(visibleProperties);
          return;
        }

        const currentZoom = map.getZoom() ?? 0;
        const bounds = map.getBounds();
        if (!bounds || currentZoom <= 4.5) {
          renderResults(visibleProperties);
          return;
        }

        const inView = visibleProperties.filter(property => bounds.contains({ lat: property.lat, lng: property.lng }));
        renderResults(inView, { inView: true });
      }

      function scheduleViewportResults() {
        window.clearTimeout(viewportListTimer);
        viewportListTimer = window.setTimeout(renderViewportResults, 140);
      }

      function markerCoordinates(marker) {
        const position = marker?.position;
        if (!position) return null;
        const lat = typeof position.lat === "function" ? position.lat() : Number(position.lat);
        const lng = typeof position.lng === "function" ? position.lng() : Number(position.lng);
        return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
      }

      function releaseTravelingClusterMarkers({ render = true } = {}) {
        if (!travelingClusterMarkers.length || !clusterer) return;
        const markers = travelingClusterMarkers;
        travelingClusterMarkers = [];
        markers.forEach(marker => { marker.map = null; });
        clusterer.addMarkers(markers, true);
        if (render) clusterer.render();
      }

      function showTravelingClusterMarkers(markers, targetMap) {
        releaseTravelingClusterMarkers();
        const uniqueMarkers = [...new Set(markers)].filter(Boolean);
        if (!uniqueMarkers.length) return;
        clusterer.removeMarkers(uniqueMarkers, true);
        uniqueMarkers.forEach(marker => { marker.map = targetMap; });
        travelingClusterMarkers = uniqueMarkers;
        clusterer.render();
      }

      function zoomLevelForBounds(bounds, targetMap, padding = 72) {
        const mapElement = targetMap.getDiv();
        const availableWidth = Math.max(mapElement.clientWidth - padding * 2, 256);
        const availableHeight = Math.max(mapElement.clientHeight - padding * 2, 256);
        const northEast = bounds.getNorthEast();
        const southWest = bounds.getSouthWest();
        const clampLatitude = latitude => Math.max(-85.05112878, Math.min(85.05112878, latitude));
        const worldY = latitude => {
          const sine = Math.sin(clampLatitude(latitude) * Math.PI / 180);
          return 0.5 - Math.log((1 + sine) / (1 - sine)) / (4 * Math.PI);
        };
        const longitudeFraction = Math.max((northEast.lng() - southWest.lng()) / 360, Number.EPSILON);
        const latitudeFraction = Math.max(Math.abs(worldY(northEast.lat()) - worldY(southWest.lat())), Number.EPSILON);
        const longitudeZoom = Math.log2(availableWidth / (256 * longitudeFraction));
        const latitudeZoom = Math.log2(availableHeight / (256 * latitudeFraction));
        return Math.max(2, Math.min(16, Math.floor(Math.min(longitudeZoom, latitudeZoom))));
      }

      function focusPropertyOnMap(property) {
        if (!map) return;

        const center = map.getCenter();
        const currentZoom = map.getZoom() ?? 4;
        const target = { lat: property.lat, lng: property.lng };
        const targetZoom = Math.min(17, Math.max(currentZoom, 13));
        const animationId = ++clusterAnimationId;

        showTravelingClusterMarkers([property.marker], map);

        const finish = () => {
          if (animationId !== clusterAnimationId) return;
          map.moveCamera({ center: target, zoom: targetZoom });
          releaseTravelingClusterMarkers();
          renderViewportResults();
          highlightPropertyCard(property, { scroll: !isCompactMapView() });
        };

        if (!center || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          finish();
          return;
        }

        const from = { lat: center.lat(), lng: center.lng() };
        const longitudeDistance = ((target.lng - from.lng + 540) % 360) - 180;
        const averageLatitude = (from.lat + target.lat) * Math.PI / 360;
        const geographicDistance = Math.hypot(
          target.lat - from.lat,
          longitudeDistance * Math.cos(averageLatitude)
        );
        const zoomDistance = Math.abs(targetZoom - currentZoom);
        const duration = Math.min(1250, 580 + zoomDistance * 55 + Math.min(280, geographicDistance * 3));
        const smootherStep = progress => progress * progress * progress
          * (progress * (progress * 6 - 15) + 10);
        let startTime;
        let lastFrame = -Infinity;

        const animate = timestamp => {
          if (animationId !== clusterAnimationId) return;
          startTime ??= timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);

          if (progress === 1 || timestamp - lastFrame >= CAMERA_FRAME_INTERVAL) {
            const centerProgress = smootherStep(Math.min(progress / 0.68, 1));
            const zoomTimeline = Math.max(0, Math.min(1, (progress - 0.06) / 0.94));
            const zoomProgress = smootherStep(zoomTimeline);
            map.moveCamera({
              center: {
                lat: from.lat + (target.lat - from.lat) * centerProgress,
                lng: from.lng + longitudeDistance * centerProgress
              },
              zoom: currentZoom + (targetZoom - currentZoom) * zoomProgress
            });
            lastFrame = timestamp;
          }

          if (progress < 1) window.requestAnimationFrame(animate);
          else finish();
        };

        window.requestAnimationFrame(animate);
      }

      function zoomIntoCluster(_event, clickedCluster, targetMap) {
        const clusterMarkers = [...new Set(clickedCluster?.markers ?? [])];
        const coordinates = clusterMarkers
          .map(markerCoordinates)
          .filter(Boolean);
        if (!coordinates.length) return;

        const clusterBounds = new google.maps.LatLngBounds();
        coordinates.forEach(position => clusterBounds.extend(position));
        const center = clusterBounds.getCenter();
        const centerLiteral = { lat: center.lat(), lng: center.lng() };
        const currentZoom = targetMap.getZoom() ?? 3;
        const boundsZoom = zoomLevelForBounds(clusterBounds, targetMap);
        const nextZoom = Math.min(Math.max(boundsZoom, Math.floor(currentZoom) + 1), 16);
        const animationId = ++clusterAnimationId;

        closePropertyDetails();
        showTravelingClusterMarkers(clusterMarkers, targetMap);

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const smootherStep = progress => progress * progress * progress
          * (progress * (progress * 6 - 15) + 10);
        const easeInOutSine = progress => -(Math.cos(Math.PI * progress) - 1) / 2;
        const startingCenter = targetMap.getCenter();

        if (prefersReducedMotion || !startingCenter) {
          targetMap.moveCamera({ center: centerLiteral, zoom: nextZoom });
          releaseTravelingClusterMarkers();
          return;
        }

        const from = { lat: startingCenter.lat(), lng: startingCenter.lng() };
        const longitudeDistance = ((centerLiteral.lng - from.lng + 540) % 360) - 180;
        const averageLatitude = (from.lat + centerLiteral.lat) * Math.PI / 360;
        const geographicDistance = Math.hypot(
          centerLiteral.lat - from.lat,
          longitudeDistance * Math.cos(averageLatitude)
        );
        const zoomDistance = Math.abs(nextZoom - currentZoom);
        const isLargeJump = zoomDistance >= 5;
        const shouldLeadTravel = geographicDistance >= 6;
        const cameraDuration = isLargeJump
          ? Math.min(1900, 850 + zoomDistance * 100)
          : Math.min(
              shouldLeadTravel ? 850 : 700,
              (shouldLeadTravel ? 500 : 420) + zoomDistance * 60 + geographicDistance * 3
            );
        let cameraStartTime;
        let lastCameraFrame = -Infinity;
        const animateCamera = timestamp => {
          if (animationId !== clusterAnimationId) return;
          cameraStartTime ??= timestamp;
          const progress = Math.min((timestamp - cameraStartTime) / cameraDuration, 1);
          if (progress === 1 || timestamp - lastCameraFrame >= CAMERA_FRAME_INTERVAL) {
            const zoomStart = shouldLeadTravel ? (isLargeJump ? 0.16 : 0.24) : 0;
            const zoomTimeline = Math.max(0, Math.min(1, (progress - zoomStart) / (1 - zoomStart)));
            const zoomProgress = isLargeJump ? easeInOutSine(zoomTimeline) : smootherStep(zoomTimeline);
            const centerProgress = shouldLeadTravel
              ? smootherStep(Math.min(progress / (isLargeJump ? 0.56 : 0.5), 1))
              : 1 - Math.pow(1 - zoomProgress, isLargeJump ? 2.5 : 3);
            targetMap.moveCamera({
              center: {
                lat: from.lat + (centerLiteral.lat - from.lat) * centerProgress,
                lng: from.lng + longitudeDistance * centerProgress
              },
              zoom: currentZoom + (nextZoom - currentZoom) * zoomProgress
            });
            lastCameraFrame = timestamp;
          }
          if (progress < 1) {
            window.requestAnimationFrame(animateCamera);
          } else {
            targetMap.moveCamera({ center: centerLiteral, zoom: nextZoom });
            releaseTravelingClusterMarkers();
            scheduleViewportResults();
          }
        };
        window.requestAnimationFrame(animateCamera);
      }

      function fitVisibleProperties() {
        if (!map || !visibleProperties.length || app.dataset.mobileView === "list") return;
        lastVisibleBounds = buildBounds(visibleProperties);
        map.fitBounds(lastVisibleBounds, { top: 62, right: 62, bottom: 62, left: 62 });
        google.maps.event.addListenerOnce(map, "idle", () => {
          if (map.getZoom() > 11) map.setZoom(11);
        });
      }

      function showState(type, title, message) {
        mapState.hidden = false;
        stateSpinner.hidden = type !== "loading";
        retryButton.hidden = type !== "error";
        stateTitle.textContent = title;
        stateMessage.textContent = message;
      }

      function hideState() {
        mapState.hidden = true;
      }

      function refreshInventory({ fit = true } = {}) {
        if (!clusterer) return;
        clusterAnimationId += 1;
        releaseTravelingClusterMarkers({ render: false });
        const min = Number(minPriceSelect.value);
        const max = maxPriceSelect.value === "Infinity" ? Infinity : Number(maxPriceSelect.value);
        if (min > max) {
          if (document.activeElement === minPriceSelect) maxPriceSelect.value = minPriceSelect.value;
          else minPriceSelect.value = maxPriceSelect.value;
        }

        visibleProperties = filteredInventory();
        clusterer.clearMarkers();
        clusterer.addMarkers(visibleProperties.map(property => property.marker));
        renderResults(visibleProperties);

        if (selectedPropertyId && !visibleProperties.some(property => property.id === selectedPropertyId)) {
          closePropertyDetails();
        }

        if (!visibleProperties.length) {
          showState("empty", "No matching properties", "Adjust the filters or search to bring properties back into view.");
        } else {
          hideState();
          if (fit) fitVisibleProperties();
        }
      }

      function setMobileView(view) {
        const isMobile = window.matchMedia("(max-width: 820px)").matches;
        if (isMobile && view === "list" && map) {
          const center = map.getCenter();
          const zoom = map.getZoom();
          if (center && Number.isFinite(zoom)) {
            savedMobileCamera = {
              center: { lat: center.lat(), lng: center.lng() },
              zoom
            };
          }
        }

        app.dataset.mobileView = view;
        const mapSelected = view === "map";
        mapTab.setAttribute("aria-selected", String(mapSelected));
        listTab.setAttribute("aria-selected", String(!mapSelected));
        document.getElementById("map-panel").hidden = !mapSelected && isMobile;
        document.getElementById("results-panel").hidden = mapSelected && isMobile;
        if (mapSelected && map) {
          requestAnimationFrame(() => {
            google.maps.event.trigger(map, "resize");
            if (savedMobileCamera) map.moveCamera(savedMobileCamera);
            clusterer?.render();
          });
        } else if (isMobile && selectedPropertyId) {
          requestAnimationFrame(() => {
            resultsList.querySelector(`[data-property-id="${selectedPropertyId}"]`)
              ?.scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
        }
      }

      function syncResponsivePanels() {
        const isMobile = window.matchMedia("(max-width: 820px)").matches;
        document.getElementById("map-panel").hidden = isMobile && app.dataset.mobileView !== "map";
        document.getElementById("results-panel").hidden = isMobile && app.dataset.mobileView !== "list";
        if (!isMobile) {
          document.getElementById("map-panel").hidden = false;
          document.getElementById("results-panel").hidden = false;
          if (map) google.maps.event.trigger(map, "resize");
        }
        syncPropertyDetailsSurface();
      }

      function redrawMapAfterTabReturn() {
        if (!map || document.hidden) return;
        const mapPanel = document.getElementById("map-panel");
        if (mapPanel.hidden || mapPanel.getClientRects().length === 0) return;

        google.maps.event.trigger(map, "resize");
        const center = map.getCenter();
        const zoom = map.getZoom();
        if (center && Number.isFinite(zoom)) {
          map.moveCamera({
            center: { lat: center.lat(), lng: center.lng() },
            zoom
          });
        }
        clusterer?.render();
      }

      function wakeMapAfterTabReturn() {
        if (document.hidden) return;
        requestAnimationFrame(redrawMapAfterTabReturn);
        window.clearTimeout(mapWakeTimer);
        mapWakeTimer = window.setTimeout(redrawMapAfterTabReturn, 220);
      }

      function wireControls() {
        let searchTimer;
        searchInput.addEventListener("input", () => {
          window.clearTimeout(searchTimer);
          searchTimer = window.setTimeout(() => refreshInventory(), 160);
        });
        document.querySelectorAll("[data-status-filter]").forEach(input => input.addEventListener("change", () => refreshInventory()));
        minPriceSelect.addEventListener("change", () => refreshInventory());
        maxPriceSelect.addEventListener("change", () => refreshInventory());
        acreageSelect.addEventListener("change", () => refreshInventory());
        sortSelect.addEventListener("change", renderViewportResults);
        resetButton.addEventListener("click", () => {
          const resetScrollPosition = { left: window.scrollX, top: window.scrollY };
          searchInput.value = "";
          minPriceSelect.value = "0";
          maxPriceSelect.value = "Infinity";
          acreageSelect.value = "any";
          document.querySelector('[data-status-filter][value="available"]').checked = true;
          document.querySelector('[data-status-filter][value="pending"]').checked = true;
          document.querySelector('[data-status-filter][value="sold"]').checked = true;
          refreshInventory();
          requestAnimationFrame(() => window.scrollTo(resetScrollPosition.left, resetScrollPosition.top));
          window.setTimeout(() => window.scrollTo(resetScrollPosition.left, resetScrollPosition.top), 350);
        });
        retryButton.addEventListener("click", () => window.location.reload());
        mapTab.addEventListener("click", () => setMobileView("map"));
        listTab.addEventListener("click", () => setMobileView("list"));
        mobilePropertyClose.addEventListener("click", () => closePropertyDetails());
        window.addEventListener("resize", syncResponsivePanels, { passive: true });
        document.addEventListener("visibilitychange", wakeMapAfterTabReturn, { passive: true });
        window.addEventListener("pageshow", wakeMapAfterTabReturn, { passive: true });
        window.addEventListener("focus", wakeMapAfterTabReturn, { passive: true });
      }

      window.initMap = async function initMap() {
        try {
          if (window.location.protocol === "file:") {
            resultCount.textContent = "Preview required";
            resultsList.replaceChildren(createTextElement("div", "empty-results", "Use the preview launcher included with this map."));
            showState(
              "error",
              "Use the preview launcher",
              "Google Maps cannot load when this HTML file is opened directly. Double-click Preview Property Map.command and use the browser window it opens."
            );
            return;
          }

          if (!window.markerClusterer?.MarkerClusterer) {
            throw new Error("The marker clustering library did not load.");
          }

          map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 38.5, lng: -98.5 },
            zoom: 4,
            minZoom: 2,
            mapId: MAP_ID,
            renderingType: google.maps.RenderingType.VECTOR,
            isFractionalZoomEnabled: true,
            backgroundColor: "#edf5f0",
            streetViewControl: false,
            mapTypeControl: true,
            mapTypeControlOptions: {
              style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
              position: google.maps.ControlPosition.TOP_LEFT
            },
            fullscreenControl: true,
            clickableIcons: false
          });
          google.maps.event.addListenerOnce(map, "tilesloaded", () => {
            app.dataset.mapRenderingType = String(map.getRenderingType() ?? "unknown").toLowerCase();
          });

          const markerLibrary = await google.maps.importLibrary("marker");
          MarkerClass = markerLibrary.AdvancedMarkerElement;
          PinClass = markerLibrary.PinElement;

          const sheetResults = await Promise.allSettled(SHEETS.map(fetchSheetRows));
          const fulfilledRows = sheetResults
            .filter(result => result.status === "fulfilled")
            .flatMap(result => result.value);
          if (!fulfilledRows.length) {
            const reason = sheetResults.find(result => result.status === "rejected")?.reason;
            throw reason instanceof Error ? reason : new Error("No inventory source could be loaded.");
          }

          properties = deduplicateProperties(fulfilledRows.map(rowToProperty).filter(Boolean));
          if (!properties.length) throw new Error("No properties with valid statuses and coordinates were found.");

          properties.forEach(createMarker);
          configurePriceFilters();
          configureSearchSuggestions();
          clusterer = new window.markerClusterer.MarkerClusterer({
            map,
            markers: [],
            onClusterClick: zoomIntoCluster
          });
          map.addListener("idle", scheduleViewportResults);
          wireControls();
          syncResponsivePanels();
          refreshInventory();
        } catch (error) {
          console.error("Property map initialization failed:", error);
          resultCount.textContent = "Unavailable";
          resultsList.replaceChildren(createTextElement("div", "empty-results", "The live inventory could not be loaded."));
          showState("error", "We couldn’t load the map", "Please check your connection and try again.");
        }
      };

      window.handleMapLoadError = function handleMapLoadError() {
        resultCount.textContent = "Unavailable";
        if (window.location.protocol === "file:") {
          showState(
            "error",
            "Use the preview launcher",
            "Google Maps cannot load when this HTML file is opened directly. Double-click Preview Property Map.command and use the browser window it opens."
          );
          return;
        }
        showState("error", "We couldn’t load the map", "The map service did not respond. Please try again.");
      };
    })();
  </script>

    onerror="handleMapLoadError()">
  </script>
