<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore available, locked, and sold AcreTown properties on an interactive map.">
  <title>AcreTown Property Map</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #1e6d45;
      --brand-dark: #164f34;
      --brand-soft: #eaf5ee;
      --ink: #15231b;
      --muted: #607067;
      --line: #dbe4de;
      --panel: #ffffff;
      --page: #f5f8f6;
      --available: #168a4b;
      --pending: #d99800;
      --sold: #cf3e3e;
      --shadow: 0 16px 40px rgba(20, 53, 35, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button, select, input[type="search"] { min-height: 42px; }
    button, label, select { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1720px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .intro-copy {
      max-width: 580px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .inventory-note {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .inventory-note[data-verified="false"]::before { background:#78867f; box-shadow:none; }

    .inventory-note::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--available);
      box-shadow: 0 0 0 4px rgba(22, 138, 75, 0.12);
      content: "";
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(210px, 1.25fr) auto repeat(4, minmax(135px, 0.55fr)) auto;
      align-items: end;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      background: var(--panel);
    }

    .location-notice {
      grid-column: 1 / -1;
      margin: 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #edf4fb;
      color: #193b5e;
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid #c9d4cc;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
      padding: 9px 11px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
    }

    .field input:focus,
    .field select:focus,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(30, 109, 69, 0.25);
      outline-offset: 2px;
      border-color: var(--brand);
    }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 286px;
      margin: 0;
      border: 0;
      padding: 0 0 1px;
    }

    .status-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 8px 11px;
      color: #536158;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      user-select: none;
    }

    .status-toggle:has(input:checked) {
      border-color: #a9c8b5;
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .status-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .status-toggle:has(input:focus-visible) {
      outline: 3px solid rgba(30, 109, 69, 0.25);
      outline-offset: 2px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(21, 35, 27, 0.18);
    }

    .status-dot.available { background: var(--available); }
    .status-dot.pending { background: var(--pending); }
    .status-dot.sold { background: var(--sold); }
    .status-dot.unknown { background: #78867f; }
    .map-credits { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:12px; line-height:1.5; }
    .map-credits a { color:inherit; text-underline-offset:3px; }

    .reset-button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--brand-dark);
      padding: 9px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }

    .reset-button:hover { background: var(--brand-soft); }

    .mobile-filter-toggle { display: none; }

    .mobile-tabs {
      display: none;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #fff;
      padding: 10px;
      gap: 8px;
    }

    .mobile-tab {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
    }

    .mobile-tab[aria-selected="true"] {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .map-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      height: clamp(580px, 73vh, 760px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0 0 var(--radius) var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .map-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #dce9df;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-state {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(245, 248, 246, 0.9);
      backdrop-filter: blur(3px);
    }

    .map-state[hidden] { display: none; }

    .state-card {
      width: min(390px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 22px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(21, 35, 27, 0.14);
    }

    .state-spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 13px;
      border: 3px solid #d7e7dc;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .state-card p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .retry-button {
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 9px 15px;
      cursor: pointer;
      font-weight: 800;
    }

    .results-panel {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: #fff;
    }

    .results-header {
      display: grid;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .results-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .result-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }

    .result-sort {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .result-sort select {
      width: 100%;
      min-height: 34px;
      border: 1px solid #c9d4cc;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      outline: none;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: normal;
      text-transform: none;
    }

    .result-sort select:focus {
      border-color: var(--brand);
      outline: 3px solid rgba(30, 109, 69, 0.2);
      outline-offset: 1px;
    }

    .results-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 10px;
      scrollbar-gutter: stable;
    }

    .property-card {
      overflow: hidden;
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .property-card:hover {
      border-color: #9bc3aa;
      box-shadow: 0 8px 20px rgba(30, 109, 69, 0.11);
      transform: translateY(-1px);
    }

    .property-card.is-active {
      border-color: var(--brand);
      background: #f1f8f4;
      box-shadow: 0 0 0 2px rgba(30, 109, 69, 0.12), 0 10px 24px rgba(30, 109, 69, 0.16);
    }

    .property-card.is-active .property-card-main { background: #f1f8f4; }

    .property-card.is-highlighting {
      animation: property-card-highlight 760ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes property-card-highlight {
      0% {
        box-shadow: 0 0 0 0 rgba(30, 109, 69, 0.38), 0 10px 24px rgba(30, 109, 69, 0.16);
      }
      70% {
        box-shadow: 0 0 0 9px rgba(30, 109, 69, 0), 0 10px 24px rgba(30, 109, 69, 0.16);
      }
      100% {
        box-shadow: 0 0 0 2px rgba(30, 109, 69, 0.12), 0 10px 24px rgba(30, 109, 69, 0.16);
      }
    }

    .property-card-main {
      display: grid;
      width: 100%;
      min-height: 0;
      grid-template-columns: 105px minmax(0, 1fr);
      border: 0;
      background: #fff;
      color: inherit;
      padding: 0;
      text-align: left;
      cursor: pointer;
      transition: background-color 180ms ease;
    }

    .property-thumb {
      position: relative;
      height: 100%;
      min-height: 112px;
      overflow: hidden;
      background: #dfe9e2;
    }

    .property-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .property-thumb img.is-fallback,
    .mobile-property-photo img.is-fallback {
      background: #e5eee8;
      object-fit: contain;
      object-position: center center;
      padding: 9px;
    }

    .property-thumb-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #617169;
      font-size: 12px;
      font-weight: 800;
    }

    .property-card-body {
      min-width: 0;
      padding: 11px 12px 9px;
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-price {
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .property-card h3 {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 13px;
      line-height: 1.35;
    }

    .card-meta {
      display: -webkit-box;
      overflow: hidden;
      margin: 6px 0 0;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 11px;
      line-height: 1.35;
    }

    .card-link {
      display: block;
      border-top: 1px solid var(--line);
      color: var(--brand);
      padding: 8px 12px;
      text-align: right;
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
    }

    .card-link:hover { background: var(--brand-soft); }

    .empty-results {
      display: grid;
      min-height: 240px;
      place-items: center;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .mobile-property-sheet {
      position: absolute;
      z-index: 10;
      bottom: 38px;
      left: 50%;
      width: min(720px, calc(100% - 32px));
      max-height: min(38%, 240px);
      overflow: auto;
      border: 1px solid rgba(219, 228, 222, 0.96);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.98);
      padding: 12px 48px 12px 12px;
      box-shadow: 0 18px 45px rgba(20, 53, 35, 0.24);
      overscroll-behavior: contain;
      transform: translateX(-50%);
      -webkit-overflow-scrolling: touch;
    }

    .mobile-property-preview {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 12px;
      color: var(--ink);
    }

    .mobile-property-photo {
      position: relative;
      min-height: 96px;
      overflow: hidden;
      border-radius: 12px;
      background: #dfe9e2;
    }

    .mobile-property-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mobile-property-body { min-width: 0; }

    .mobile-property-preview h3 {
      display: -webkit-box;
      overflow: hidden;
      margin: 5px 0 4px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 14px;
      line-height: 1.3;
    }

    .mobile-property-address {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 12px;
      line-height: 1.35;
    }

    .mobile-property-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-top: 8px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 850;
      text-decoration: none;
    }

    .mobile-property-link:hover { background: var(--brand-dark); }

    .mobile-property-close {
      position: absolute;
      z-index: 1;
      top: 8px;
      right: 8px;
      display: grid;
      width: 36px;
      min-height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      box-shadow: 0 4px 12px rgba(20, 53, 35, 0.12);
    }

    .mobile-property-close:hover { background: var(--brand-soft); }

    /* In a desktop page or iframe, keep the complete experience inside the
       available viewport. The map receives whatever height remains after the
       title and filters instead of forcing the outer page to scroll. */
    @media (min-width: 821px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      .app {
        display: grid;
        width: min(1720px, 100%);
        height: 100vh;
        height: 100dvh;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }

      .map-shell {
        min-height: 0;
        height: auto;
      }
    }

    @media (max-width: 1280px) {
      .toolbar {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .search-field { grid-column: 1; }
      .status-group { grid-column: 2 / 4; }
      .reset-button { grid-column: 4; grid-row: 1; }
      .map-shell { grid-template-columns: minmax(0, 1fr) 340px; }
    }

    @media (max-width: 820px) {
      .app { padding: 12px; }
      .intro { align-items: start; flex-direction: column; gap: 8px; }
      .inventory-note { margin-bottom: 0; }
      .intro-copy { display: none; }
      .app[data-mobile-filters] .mobile-filter-toggle {
        display: flex;
        grid-column: 1 / -1;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--brand-dark);
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .app[data-mobile-filters="closed"] .advanced-filter { display: none; }
      .field input, .field select { font-size: 16px; min-height: 44px; }
      .status-toggle, .mobile-tab, .mobile-property-close, .mobile-property-link { min-height: 44px; }
      .mobile-property-close { width: 44px; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .search-field, .status-group, .state-field { grid-column: 1 / -1; }
      .status-group { min-width: 0; }
      .acreage-field { grid-column: 1 / -1; }
      .reset-button { grid-column: 1 / -1; grid-row: auto; }
      .mobile-tabs { display: flex; }
      .map-shell {
        display: block;
        height: clamp(500px, 70vh, 680px);
      }
      .map-panel, .results-panel { width: 100%; height: 100%; }
      .results-panel { border-left: 0; }
      .app[data-mobile-view="map"] .results-panel { display: none; }
      .app[data-mobile-view="list"] .map-panel { display: none; }
      .results-list { padding: 12px; }
      .mobile-property-sheet {
        right: 12px;
        bottom: 12px;
        left: 12px;
        width: auto;
        transform: none;
      }
    }

    @media (max-width: 480px) {
      .app { padding: 0; }
      .intro { padding: 16px 16px 12px; }
      .intro-copy { font-size: 13px; }
      .toolbar { border-right: 0; border-left: 0; border-radius: 0; padding: 12px; }
      .mobile-tabs { border-right: 0; border-left: 0; }
      .map-shell { border-right: 0; border-left: 0; border-radius: 0; box-shadow: none; }
      .status-toggle { flex: 1 1 auto; justify-content: center; }
      .property-card-main { grid-template-columns: 96px minmax(0, 1fr); }
      .mobile-property-sheet {
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        left: 8px;
        width: auto;
        max-height: min(38%, 220px);
        transform: none;
      }
      .mobile-property-preview { grid-template-columns: minmax(0, 1fr); }
      .mobile-property-photo { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    [data-map-unavailable="true"] .map-shell { grid-template-columns: 1fr; }
    [data-map-unavailable="true"] .results-panel { width: 100%; max-width: none; }
    [data-map-unavailable="true"] .property-card-main { color: inherit; text-decoration: none; }
  </style>
<style id="acretown-map-viewport">
/* Fit the existing controls and map to the available iframe viewport. */
html,body {height:100%;overflow:hidden;}
.app {display:flex;flex-direction:column;width:min(1720px,100%);height:100vh;height:100dvh;min-height:0;padding:12px;overflow:hidden;}
.intro {flex:0 0 auto;gap:12px;margin-bottom:10px;}
.intro h1 {font-size:26px;}
.intro .eyebrow,.intro-copy {display:none;}
.toolbar {flex:0 0 auto;padding:10px;gap:8px;}
.mobile-tabs {flex:0 0 auto;}
.map-shell {flex:1 1 0;min-height:160px;height:auto;}
@media(min-width:1101px) and (max-width:1500px){
 .toolbar {grid-template-columns:minmax(190px,1.5fr) auto repeat(4,minmax(92px,.65fr)) auto;}
 .search-field,.status-group,.reset-button {grid-column:auto;grid-row:auto;}
 .status-group {gap:5px;min-width:0;}
 .status-toggle {padding:8px 9px;}
 .field {font-size:10px;}
 .reset-button {padding:9px;}
}
@media(max-width:820px){
 .app {padding:8px;}
 .intro {flex-direction:row;align-items:center;padding:4px 2px;margin-bottom:6px;}
 .intro > div:first-child {min-width:0;}
 .intro h1 {font-size:20px;}
 .inventory-note {font-size:11px;gap:6px;}
 .toolbar {grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:8px;flex:0 1 auto;min-height:118px;max-height:50%;overflow:auto;overscroll-behavior:contain;}
 .search-field {grid-column:1;grid-row:1;}
 .status-group {grid-column:1 / -1;grid-row:2;gap:6px;}
 .app[data-mobile-filters] .mobile-filter-toggle {grid-column:2;grid-row:1;align-self:end;gap:12px;padding:10px;}
 .mobile-tabs {padding:6px;}
 .map-shell {height:auto;min-height:160px;}
 .map-panel,.results-panel {height:100%;}
}
@media(max-width:480px){
 .app {padding:0;}
 .intro {padding:8px 10px 2px;}
 .intro h1 {font-size:19px;}
