      function decodeEntities(value) {
        const namedEntities = {
          amp: "&",
          apos: "'",
          gt: ">",
          lt: "<",
          nbsp: "\u00a0",
          quot: "\""
        };
        return String(value ?? "").replace(
          /&#(\d+);|&#x([0-9a-f]+);|&(amp|apos|gt|lt|nbsp|quot);/gi,
          (match, decimal, hexadecimal, named) => {
            if (named) return namedEntities[named.toLowerCase()] ?? match;
            const codePoint = Number.parseInt(decimal || hexadecimal, decimal ? 10 : 16);
            return Number.isInteger(codePoint) && codePoint >= 0 && codePoint <= 0x10ffff
              ? String.fromCodePoint(codePoint)
              : match;
          }
        );
      }

      function safeHttpUrl(value) {
        if (!value) return null;
        try {
          const url = new URL(String(value), window.location.href);
          return ["http:", "https:"].includes(url.protocol) ? url.href : null;
        } catch {
          return null;
        }
      }

      function mainPropertyPhotoUrl(value) {
        const url = safeHttpUrl(value);
        if (!url) return "";
        if (url === ACRETOWN_LOGO_URL || LEGACY_ACRETOWN_LOGO_URLS.includes(url)) return "";
        let searchableUrl = url;
        try { searchableUrl = decodeURIComponent(url); } catch (_) {}
        return NON_PROPERTY_PHOTO_PATTERN.test(searchableUrl) ? "" : url;
      }

      function formatPrice(value) {
        if (value === null || value === undefined || String(value).trim() === "") {
          return "Price unavailable";
        }
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return "Price unavailable";
        return numeric.toLocaleString("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0
        });
      }

      function parsePrice(value) {
        if (typeof value === "number" && Number.isFinite(value)) return value;
        const cleaned = String(value ?? "").replace(/[$,\s]/g, "");
        if (!cleaned) return null;
        const numeric = Number(cleaned);
        return Number.isFinite(numeric) ? numeric : null;
      }

      function normalizeStatus(rawStatus) {
        const normalized = String(rawStatus ?? "").trim().toLowerCase();
        if (normalized.startsWith("sold")) return "sold";
        if (normalized === "pending" || normalized.startsWith("sale pending")) return "pending";
        if (normalized === "available" || normalized.startsWith("full marketing") || normalized.startsWith("basic marketing")) return "available";
        return null;
      }

      function normalizeSearchText(value) {
        const normalized = String(value ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim()
          .replace(/\s+/g, " ");
        return normalized
          .split(" ")
          .filter(Boolean)
          .map(word => SEARCH_WORD_ALIASES[word] ?? word)
          .join(" ");
      }

      function extractStateCode(...values) {
        for (const value of values) {
          const matches = String(value ?? "").matchAll(/,\s*([A-Z]{2})(?=\s|\d|$)/g);
          for (const match of matches) {
            if (STATE_NAMES[match[1]]) return match[1];
          }
        }
        for (const value of values) {
          const text = normalizeSearchText(value);
          for (const [code, name] of Object.entries(STATE_NAMES).sort((a, b) => b[1].length - a[1].length)) {
            if (new RegExp(`(?:^| )${normalizeSearchText(name)}(?: |$)`).test(text)) return code;
          }
        }
        return "";
      }

      function cellValue(row, index, formatted = false) {
        const cell = row?.c?.[index];
        if (!cell) return "";
        if (formatted && cell.f != null) return cell.f;
        return cell.v ?? "";
      }

      function parseGvizResponse(text) {
        const prefix = "google.visualization.Query.setResponse(";
        const start = text.indexOf(prefix);
        const end = text.lastIndexOf(");");
        if (start === -1 || end === -1 || end <= start) {
          throw new Error("The inventory response was not recognized.");
        }
        return JSON.parse(text.slice(start + prefix.length, end));
      }

      function propertyKey(value) {
        try {
          const url = new URL(value);
          if (!/^https?:$/.test(url.protocol) || !/^(?:www\.)?acretown\.com$/i.test(url.hostname)) return "";
          const parts = url.pathname.split("/").filter(Boolean);
          if (parts.length !== 1 && !(parts.length === 2 && parts[0] === "property")) return "";
          const key = decodeURIComponent(parts[parts.length - 1]).toLowerCase();
          return VERIFIED_LEGACY_IDS[key] || key;
        } catch (_) { return ""; }
      }

      function snapshotIsFresh(snapshot, now = Date.now()) {
        const timestamp = Date.parse(snapshot?.checkedAt);
        return Boolean(snapshot && Number.isFinite(timestamp) && timestamp <= now && now - timestamp < STATUS_MAX_AGE);
      }

      function snapshotStatusIndex(snapshot, now = Date.now()) {
        if (!snapshotIsFresh(snapshot, now) || snapshot.schemaVersion !== 1 ||
            !Array.isArray(snapshot.details) || !snapshot.details.length || !Array.isArray(snapshot.properties)) {
          throw new Error("Current property status is unavailable.");
        }
        const index = new Map();
        const statuses = { Available: "available", Locked: "pending", Sold: "sold", Hold: "hold" };
        const seenDetails = new Set();
        for (const item of snapshot.details) {
          if (!item || typeof item.id !== "string" || !/^[a-zA-Z0-9_+\-]+$/.test(item.id) || !statuses[item.status]) throw new Error("Invalid status record.");
          const key = item.id.toLowerCase();
          if (seenDetails.has(key)) throw new Error("Duplicate status record.");
          seenDetails.add(key);
          index.set(key, statuses[item.status]);
        }
        const seenListings = new Set();
        for (const item of snapshot.properties) {
          const key = propertyKey(item?.url);
          const id = String(item?.id || "").toLowerCase();
          if (typeof item?.id !== "string" || seenListings.has(id)) throw new Error("Duplicate or invalid current listing.");
          seenListings.add(id);
          if (!key || !statuses[item?.status] || !index.has(id) || index.get(id) !== statuses[item.status]) throw new Error("Conflicting property status.");
          if (index.has(key) && index.get(key) !== statuses[item.status]) throw new Error("Conflicting listing alias.");
          index.set(key, statuses[item.status]);
        }
        return index;
      }

      function projectedMapStatus(property, index) {
        const current = index?.get(propertyKey(property.link));
        // The map also retains older sold-land history outside the active feed.
        return current || (property.baseStatus === "sold" ? "sold" : "unknown");
      }

      function verifiedDay(value, now = Date.now()) {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return 0;
        const day = Date.parse(value + "T00:00:00Z");
        return Number.isFinite(day) && new Date(day).toISOString().slice(0, 10) === value
          && day <= Math.floor(now / 86400000) * 86400000 ? day : 0;
      }

      function verifiedPublicListing(listing, now = Date.now()) {
        const record = listing?.publicListing;
        if (!record || record.source !== "carrot-property-page" || record.url !== listing.url
            || !propertyKey(record.url)) return null;
        const checked = Date.parse(record.checkedAt), expires = Date.parse(record.expiresAt);
        if (!Number.isFinite(checked) || !Number.isFinite(expires) || checked > now
            || expires <= now || expires <= checked || expires - checked > PUBLIC_LISTING_MAX_AGE) return null;
        return record;
      }

      function propertySignature(property) {
        return JSON.stringify([property.baseStatus, property.status, property.title, property.price,
          property.priceLabel, property.address, property.acres, property.acresLabel, property.lat,
          property.lng, property.link, property.photo, property.publishedDate, property.soldDate,
          property.sourceTitle, property.sourcePhoto, property.sourceIndex, property.verifiedSupplement, property.listingFallback]);
      }

      function markerSignature(property) {
        return JSON.stringify([property.status, property.title, property.lat, property.lng]);
      }

      function hasCoordinates(property) {
        return Number.isFinite(property.lat) && Number.isFinite(property.lng);
      }

      function reconcileProperties(next) {
        const previous = new Map(properties.map(property => [property.id, property]));
        let changed = properties.length !== next.length;
        properties = next.map(property => {
          const old = previous.get(property.id);
          if (!old) {
            changed = true;
            if (mapReady && hasCoordinates(property)) createMarker(property);
            return property;
          }
          previous.delete(property.id);
          const markerChanged = markerSignature(old) !== markerSignature(property);
          if (propertySignature(old) !== propertySignature(property)) changed = true;
          const marker = old.marker;
          Object.assign(old, property, { marker });
          if (markerChanged && marker) { marker.map = null; old.marker = null; }
          if (mapReady && !old.marker && hasCoordinates(old)) createMarker(old);
          return old;
        });
        previous.forEach(property => { if (property.marker) property.marker.map = null; });
        return changed;
      }

      function projectProperties(rows, index) {
        const listings = new Map((index ? statusSnapshot.properties : []).map(item => [propertyKey(item.url), item]));
        const details = new Map((index ? statusSnapshot.details : []).map(item => [item.id.toLowerCase(), item]));
        const next = rows.filter(property => !property.listingFallback || !index || listings.has(propertyKey(property.link)))
          .map(property => ({ ...property }));
        const keys = new Set(next.map(property => propertyKey(property.link)));
        if (index) {
          for (const geometry of VERIFIED_GEOMETRY) {
            if (keys.has(geometry.id)) continue;
            const listing = listings.get(geometry.id);
            if (!listing || !["Available", "Locked", "Sold"].includes(listing.status)) continue;
            const values = [listing.status === "Locked" ? "Pending" : listing.status, listing.title, "",
              geometry.address, listing.acres, geometry.lat, geometry.lng, listing.url, listing.image, ""];
            const property = rowToProperty({ c: values.map(value => ({ v: value })) }, next.length);
            if (property) { property.verifiedSupplement = true; next.push(property); keys.add(geometry.id); }
          }
          // The current listing remains browsable even if its coordinates source is unavailable.
          if (!hasGeometryFeed) {
            for (const listing of statusSnapshot.properties) {
              if (keys.has(propertyKey(listing.url))) continue;
              const values = [listing.status === "Locked" ? "Pending" : listing.status, listing.title, "",
                STATE_NAMES[listing.state] || "See property page for location", "", 0, 0, listing.url, listing.image, ""];
              const property = rowToProperty({ c: values.map(value => ({ v: value })) }, next.length);
              if (!property) continue;
              property.listingFallback = true;
              property.lat = null; property.lng = null; property.acres = null; property.acresLabel = "See listing";
              property.stateCode = listing.state || ""; property.stateName = STATE_NAMES[property.stateCode] || "";
              next.push(property);
            }
          }
        }
        nextMetadataExpiry = Infinity;
        for (const property of next) {
          const key = propertyKey(property.link), listing = listings.get(key), detail = details.get(key);
          property.status = projectedMapStatus(property, index);
          property.statusLabel = STATUS_META[property.status].label;
          const metadata = verifiedPublicListing(listing);
          property.title = metadata?.title || property.sourceTitle || property.title;
          property.photo = mainPropertyPhotoUrl(metadata?.image || property.sourcePhoto || property.photo);
          property.price = metadata?.priceStatus === "verified" && Number.isFinite(metadata.advertisedCashPrice)
            && metadata.advertisedCashPrice > 0 ? metadata.advertisedCashPrice : null;
          property.priceLabel = property.price === null && !listing ? "View listing for price" : formatPrice(property.price);
          if (metadata) nextMetadataExpiry = Math.min(nextMetadataExpiry, Date.parse(metadata.expiresAt));
          if (index) {
            property.publishedDate = verifiedDay(metadata?.publishedDate || listing?.publishedDate)
              ? (metadata?.publishedDate || listing.publishedDate) : "";
            property.soldDate = detail?.status === "Sold" && verifiedDay(detail.soldDate) ? detail.soldDate : "";
          }
          property.searchText = normalizeSearchText([property.title, property.address, property.statusLabel,
            property.acresLabel, property.stateCode, property.stateName].join(" "));
        }
        return next;
      }

      function applyCurrentAvailability({ render = true, sourceRows = null } = {}) {
        let index;
        try { index = snapshotStatusIndex(statusSnapshot); } catch (_) { index = null; }
        availabilityWasFresh = Boolean(index);
        inventoryFreshness.textContent = index ? "Live inventory" : "Checking availability";
        inventoryFreshness.dataset.verified = String(Boolean(index));
        // Keep a verified location while offline, but never keep an expired availability/price claim.
        const rows = sourceRows || properties.filter(property => !index || !property.verifiedSupplement);
        const changed = reconcileProperties(projectProperties(rows, index));
        const unverified = properties.some(property => property.status === "unknown");
        availabilityNotice.hidden = !unverified;
        availabilityNotice.textContent = unverified
          ? "Some current statuses could not be verified. Check the property listing for details." : "";
        app.dataset.availabilityCheckedAt = index ? statusSnapshot.checkedAt : "";
        if (render && changed) {
          configurePriceFilters();
          configureSearchSuggestions();
          refreshInventory({ fit: false, preserveLocation: Boolean(searchLocation) });
          const selected = properties.find(property => property.id === selectedPropertyId);
          if (mapReady && selected && visibleProperties.includes(selected)) showPropertyDetails(selected);
        }
        return changed;
      }

      async function fetchCurrentStatus(url, timeout) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(url, { cache: "no-store", credentials: "omit", signal: controller.signal });
          if (!response.ok) throw new Error("Status request failed.");
          const snapshot = await response.json();
          snapshotStatusIndex(snapshot);
          return snapshot;
        } finally { window.clearTimeout(timer); }
      }

      function refreshAuthoritativeStatus() {
        applyCurrentAvailability();
        if (statusRequest) return statusRequest;
        statusRequest = (async () => {
          let snapshot;
          try { snapshot = await fetchCurrentStatus(STATUS_ENDPOINT, 10000); }
          catch (_) { snapshot = await fetchCurrentStatus(STATUS_FALLBACK, 30000); }
          if (!statusSnapshot || Date.parse(snapshot.checkedAt) >= Date.parse(statusSnapshot.checkedAt)) statusSnapshot = snapshot;
        })().catch(() => {}).finally(() => {
          statusRequest = null;
          applyCurrentAvailability();
          if (!properties.length) renderViewportResults();
        });
        return statusRequest;
      }

      function refreshMapGeometry() {
        if (geometryRequest) return geometryRequest;
        geometryRequest = (async () => {
          const rows = (await Promise.all(SHEETS.map(fetchSheetRows))).flat();
          const updated = deduplicateProperties(rows.map(rowToProperty).filter(Boolean));
          if (!updated.length) throw new Error("Map inventory is empty.");
          hasGeometryFeed = true;
          const changed = applyCurrentAvailability({ render: false, sourceRows: updated });
          geometryCheckedAt = Date.now();
          if (changed) {
            configurePriceFilters();
            configureSearchSuggestions();
            refreshInventory({ fit: false, preserveLocation: Boolean(searchLocation) });
            const selected = properties.find(property => property.id === selectedPropertyId);
            if (mapReady && selected && visibleProperties.includes(selected)) showPropertyDetails(selected);
          }
          return true;
        })().catch(() => {
          if (!properties.some(hasCoordinates)) enterListFallback("Property locations are taking longer to load. You can still browse the property list.");
          return false;
        }).finally(() => {
          geometryRequest = null;
          if (!properties.length) renderViewportResults();
        });
        return geometryRequest;
      }

      function refreshMapSources() {
        if (document.visibilityState === "hidden") return;
        refreshAuthoritativeStatus();
        if (Date.now() - geometryCheckedAt >= GEOMETRY_REFRESH_MS) refreshMapGeometry();
      }

      async function fetchWithTimeout(url, options = {}, timeout = SOURCE_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(url, { ...options, signal: controller.signal });
          if (!response.ok) throw new Error("Request failed (" + response.status + ").");
          // Keep the timeout active while downloading the response body as well.
          return await response.text();
        } finally { window.clearTimeout(timer); }
      }

      async function fetchSheetRows({ sheetId, gid, sheetName }) {
        const selector = sheetName ? "&sheet=" + encodeURIComponent(sheetName) : "&gid=" + encodeURIComponent(gid);
        const url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(sheetId) + "/gviz/tq?tqx=out:json" + selector;
        const payload = parseGvizResponse(await fetchWithTimeout(url, { cache: "no-store" }));
        if (payload.status && payload.status !== "ok") throw new Error("The inventory source returned an error.");
        return payload.table?.rows ?? [];
      }

      function rowToProperty(row, index) {
        const rawStatus = decodeEntities(cellValue(row, 0));
        const status = normalizeStatus(rawStatus);
        const title = decodeEntities(cellValue(row, 1)).trim();
        const address = decodeEntities(cellValue(row, 3)).trim();
        const rawLat = cellValue(row, 5);
        const rawLng = cellValue(row, 6);
        const link = safeHttpUrl(cellValue(row, 7));
        const coordinateOverride = COORDINATE_OVERRIDES.find(override => (
          override.link === link
          && normalizeSearchText(override.address) === normalizeSearchText(address)
        ));
        if (String(rawLat).trim() === "" || String(rawLng).trim() === "") return null;
        const lat = coordinateOverride?.lat ?? Number(rawLat);
        const lng = coordinateOverride?.lng ?? Number(rawLng);
        if (!status || !Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
          return null;
        }

        const numericPrice = parsePrice(cellValue(row, 2));
        const numericAcres = Number(cellValue(row, 4));
        const acresLabel = decodeEntities(cellValue(row, 4, true)) || (Number.isFinite(numericAcres) ? String(numericAcres) : "Not listed");
        const stateCode = extractStateCode(address, title);
        const stateName = STATE_NAMES[stateCode] ?? "";
        const latestDate = decodeEntities(cellValue(row, 9, true) || cellValue(row, 9)).trim();
        const latestTimestamp = Date.parse(latestDate);

        return {
          id: `property-${propertyKey(link) || index}`,
          baseStatus: status,
          status,
          statusLabel: STATUS_META[status].label,
          title: title || address || "Property",
          sourceTitle: title || address || "Property",
          sourcePhoto: mainPropertyPhotoUrl(cellValue(row, 8)),
          publishedDate: "",
          soldDate: "",
          listingFallback: false,
          verifiedSupplement: false,
          price: numericPrice,
          priceLabel: formatPrice(numericPrice),
          address: address || "Address unavailable",
          acres: Number.isFinite(numericAcres) ? numericAcres : null,
          acresLabel,
          latestDate,
          latestTimestamp: Number.isFinite(latestTimestamp) ? latestTimestamp : null,
          sourceIndex: index,
          stateCode,
          stateName,
          searchText: normalizeSearchText(`${title} ${address} ${STATUS_META[status].label} ${acresLabel} ${stateCode} ${stateName}`),
          lat,
          lng,
          link,
          photo: mainPropertyPhotoUrl(cellValue(row, 8)),
          marker: null
        };
      }

      function deduplicateProperties(items) {
        const uniqueProperties = new Map();
        items.forEach(property => {
          const identity = [
            normalizeSearchText(property.title),
            normalizeSearchText(property.address),
            normalizeSearchText(property.acresLabel),
            property.link
          ].join("|");
          uniqueProperties.set(identity, property);
        });
        return [...uniqueProperties.values()];
      }

      function createTextElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text;
        return element;
      }

      function createStatusBadge(property) {
        const badge = document.createElement("span");
        badge.className = "status-badge";
        const dot = document.createElement("span");
        dot.className = `status-dot ${property.status}`;
        dot.setAttribute("aria-hidden", "true");
        badge.append(dot, document.createTextNode(property.statusLabel));
        return badge;
      }

      function thumbnailUrl(value, width) {
        try {
          const url = new URL(value);
          if (url.hostname !== "image-cdn.carrot.com" || !url.pathname.startsWith("/uploads/")) return value;
          // This is the same image service and transformation format used by Carrot's own srcsets.
          const request = { bucket: "production.carrot-uploads.oncarrot.com", key: url.pathname.slice(1),
            edits: { resize: { width, fit: "cover" }, toFormat: "webp", webp: { quality: 80 } } };
          return url.origin + "/" + btoa(JSON.stringify(request));
        } catch (_) { return value; }
      }

      function makePropertyImage(property, className) {
        const wrapper = document.createElement("div");
        wrapper.className = className;
        const fallback = createTextElement("span", "property-thumb-fallback", "AcreTown");
        wrapper.appendChild(fallback);
        const image = document.createElement("img");
        const original = property.photo || ACRETOWN_LOGO_URL;
        const thumbnail = property.photo ? thumbnailUrl(original, className === "property-thumb" ? 384 : 720) : original;
        let triedOriginal = thumbnail === original, triedLogo = !property.photo;
        image.src = thumbnail;
        image.alt = property.photo ? "Featured view of " + property.title : "AcreTown logo";
        image.loading = "lazy";
        image.decoding = "async";
        if (!property.photo) image.classList.add("is-fallback");
        image.addEventListener("load", () => fallback.remove(), { once: true });
        image.addEventListener("error", () => {
          if (!triedOriginal) { triedOriginal = true; image.src = original; return; }
          if (!triedLogo) {
            triedLogo = true; image.classList.add("is-fallback"); image.alt = "AcreTown logo"; image.src = ACRETOWN_LOGO_URL; return;
          }
          image.remove();
        });
        wrapper.appendChild(image);
        return wrapper;
      }

      function propertyLocation(property) {
        const parts = property.address.split(",").map(part => part.trim());
        return parts.length >= 3
          ? parts.slice(-2).join(", ").replace(/\s+\d{5}(?:-\d{4})?\b/, "")
          : property.title.split("|")[0].trim();
      }

      function propertyAcreage(property) {
        return Number.isFinite(property.acres) ? property.acres + " acres" : "See listing for acreage";
      }

      function createPriceText(property, tag, className) {
        const price = createTextElement(tag, className, property.priceLabel || formatPrice(property.price));
        if (!Number.isFinite(property.price)) price.classList.add("price-unavailable");
        return price;
      }

      function buildMobilePropertyPreview(property) {
        const container = createTextElement("div", "mobile-property-preview", "");
        container.appendChild(makePropertyImage(property, "mobile-property-photo"));
        const body = createTextElement("div", "mobile-property-body", "");
        body.appendChild(createStatusBadge(property));
        body.appendChild(createPriceText(property, "strong", "explorer-detail-price"));
        const title = createTextElement("h3", "", propertyLocation(property));
        title.title = property.title;
        body.appendChild(title);
        body.appendChild(createTextElement("p", "mobile-property-address", propertyAcreage(property)));
        container.appendChild(body);
        if (property.link) {
          const link = createTextElement("a", "mobile-property-link", "View property");
          link.href = property.link;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.setAttribute("aria-label", "View " + property.title);
          const arrow = createTextElement("span", "", "↗");
          arrow.setAttribute("aria-hidden", "true");
          link.appendChild(arrow);
          container.appendChild(link);
        }
        return container;
      }

      function clearActiveCard() {
        window.clearTimeout(propertyHighlightTimer);
        propertyHighlightTimer = 0;
        resultsList.querySelectorAll(".property-card.is-active, .property-card.is-highlighting").forEach(card => {
          card.classList.remove("is-active", "is-highlighting");
          card.querySelector(".property-card-main")?.setAttribute("aria-pressed", "false");
        });
      }

      function highlightPropertyCard(property, { scroll = true } = {}) {
        clearActiveCard();
        const card = resultsList.querySelector(`[data-property-id="${property.id}"]`);
        if (!card) return;

        card.classList.add("is-active", "is-highlighting");
        card.querySelector(".property-card-main")?.setAttribute("aria-pressed", "true");
        if (scroll && !isCompactMapView()) {
          card.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
        propertyHighlightTimer = window.setTimeout(() => {
          card.classList.remove("is-highlighting");
          propertyHighlightTimer = 0;
        }, 800);
      }

      function isCompactMapView() {
        return window.matchMedia("(max-width: 820px)").matches;
      }

      function hideMobilePropertySheet() {
        mobilePropertySheet.hidden = true;
        mobilePropertyContent.replaceChildren();
      }

      function showPropertyDetails(property) {
        mobilePropertyContent.replaceChildren(buildMobilePropertyPreview(property));
        mobilePropertySheet.hidden = false;
        mobilePropertySheet.scrollTop = 0;
        propertyDetailsSurface = "preview";
      }

      function closePropertyDetails({ clearSelection = true } = {}) {
        hideMobilePropertySheet();
        propertyDetailsSurface = null;
        if (clearSelection) {
          selectedPropertyId = null;
          clearActiveCard();
        }
      }

      function syncPropertyDetailsSurface() {
        if (!selectedPropertyId) return;
        const property = visibleProperties.find(item => item.id === selectedPropertyId);
        if (!property) return;
        if (propertyDetailsSurface !== "preview") showPropertyDetails(property);
      }

      function openProperty(property, { focusMap = false, pan = true, scrollCard = true } = {}) {
        selectedPropertyId = property.id;
        showPropertyDetails(property);
        highlightPropertyCard(property, { scroll: scrollCard });
        if (focusMap) {
          focusPropertyOnMap(property);
        } else {
          clusterAnimationId += 1;
          releaseTravelingClusterMarkers();
          if (map && pan && isCompactMapView()) map.panTo({ lat: property.lat, lng: property.lng });
        }
      }

      function createMarker(property) {
        if (!map || !MarkerClass || !PinClass || !hasCoordinates(property)) return;
        const meta = STATUS_META[property.status];
        const pin = new PinClass({
          background: meta.color,
          borderColor: meta.border,
          glyphColor: "#ffffff",
          scale: property.status === "sold" ? 0.84 : 0.94
        });
        const marker = new MarkerClass({
          position: { lat: property.lat, lng: property.lng },
          title: `${property.statusLabel}: ${property.title}`,
          content: pin,
          gmpClickable: true,
          zIndex: property.status === "sold" ? 1 : 2
        });
        marker.addEventListener("gmp-click", () => openProperty(property));
        property.marker = marker;
      }

      function appendSelectOption(select, value, label) {
        const option = document.createElement("option");
        option.value = String(value);
        option.textContent = label;
        select.appendChild(option);
      }

      function configurePriceFilters() {
        const finitePrices = properties.map(property => property.price).filter(Number.isFinite);
        const highestPrice = finitePrices.length ? Math.max(...finitePrices) : 0;
        PRICE_STEPS.filter(value => value <= highestPrice).forEach(value => {
          if ([...minPriceSelect.options].some(option => Number(option.value) === value)) return;
          appendSelectOption(minPriceSelect, value, formatPrice(value));
          appendSelectOption(maxPriceSelect, value, formatPrice(value));
        });
        if (highestPrice > 0 && !PRICE_STEPS.includes(highestPrice)) {
          const roundedCeiling = Math.ceil(highestPrice / 100000) * 100000;
          if (![...maxPriceSelect.options].some(option => Number(option.value) === roundedCeiling)) {
            appendSelectOption(maxPriceSelect, roundedCeiling, formatPrice(roundedCeiling));
          }
        }
      }

      function configureStateFilter() {
        Object.entries(STATE_NAMES)
          .sort((a, b) => a[1].localeCompare(b[1]))
          .forEach(([code, name]) => appendSelectOption(stateSelect, code, name));
      }

      function configureSearchSuggestions() {
        const suggestionMap = new Map();
        const addSuggestion = value => {
          const label = String(value ?? "").trim();
          const key = normalizeSearchText(label);
          if (key.length >= 2 && !suggestionMap.has(key)) suggestionMap.set(key, label);
        };

        properties.forEach(property => {
          addSuggestion(property.title.split("|")[0]);
          // Keep ZIP codes searchable through property.searchText, but do not
          // surface them in the autocomplete menu.
          addSuggestion(property.address.replace(/\s+\d{5}(?:-\d{4})?\s*$/, ""));
          addSuggestion(property.stateName);

          const addressParts = property.address.split(",").map(part => part.trim()).filter(Boolean);
          if (addressParts.length >= 2) {
            const city = addressParts[addressParts.length - 2];
            addSuggestion(property.stateName ? `${city}, ${property.stateName}` : city);
          }

        });

        const fragment = document.createDocumentFragment();
        [...suggestionMap.values()]
          .sort((a, b) => a.localeCompare(b))
          .forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            fragment.appendChild(option);
          });
        searchSuggestions.replaceChildren(fragment);
      }

      function selectedStatuses() {
        return new Set(
          [...document.querySelectorAll("[data-status-filter]:checked")].map(input => input.value)
        );
      }

      function filteredInventory({ ignoreSearch = false } = {}) {
        const statuses = selectedStatuses();
        const minPrice = Number(minPriceSelect.value);
        const maxPrice = maxPriceSelect.value === "Infinity" ? Infinity : Number(maxPriceSelect.value);
        const acreageRange = acreageSelect.value === "any"
          ? null
          : acreageSelect.value.split("-").map(value => value === "Infinity" ? Infinity : Number(value));
        const queryTokens = ignoreSearch ? [] : normalizeSearchText(searchInput.value).split(" ").filter(Boolean);

        return properties.filter(property => {
          if (property.status === "hold") return false;
          if (!statuses.has(property.status) && !(property.status === "unknown" && statuses.size === 3)) return false;
          if (stateSelect.value && property.stateCode !== stateSelect.value) return false;
          if (Number.isFinite(property.price) && (property.price < minPrice || property.price > maxPrice)) return false;
          if (!Number.isFinite(property.price) && (minPrice > 0 || Number.isFinite(maxPrice))) return false;
          if (acreageRange) {
            if (!Number.isFinite(property.acres)) return false;
            const [minimumAcres, maximumAcres] = acreageRange;
            if (property.acres < minimumAcres || property.acres >= maximumAcres) return false;
          }
          if (!queryTokens.length) return true;
          const propertyWords = new Set(property.searchText.split(" "));
          return queryTokens.every(token => (
            token.length <= 2
              ? propertyWords.has(token)
              : property.searchText.includes(token)
          ));
        });
      }

      function distanceMiles(origin, property) {
        const radians = degrees => degrees * Math.PI / 180;
        const latDelta = radians(property.lat - origin.lat);
        const lngDelta = radians(property.lng - origin.lng);
        const a = Math.sin(latDelta / 2) ** 2 + Math.cos(radians(origin.lat))
          * Math.cos(radians(property.lat)) * Math.sin(lngDelta / 2) ** 2;
        return 3958.8 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0, 1 - a)));
      }

      function nearestProperties(origin, items) {
        const ranked = items.filter(hasCoordinates).map(property => ({ property, miles: distanceMiles(origin, property) }))
          .sort((a, b) => a.miles - b.miles || a.property.sourceIndex - b.property.sourceIndex);
        if (!ranked.length) return [];
        const radius = Math.max(ranked[0].miles * 1.5, ranked[0].miles + 25);
        return ranked.filter(item => item.miles <= radius).slice(0, 3);
      }

      function clearSearchLocation() {
        searchLocation = null;
        if (searchLocationMarker) searchLocationMarker.map = null;
        searchLocationMarker = null;
        locationNotice.hidden = true;
        locationNotice.textContent = "";
      }

      function announceLocation(message) {
        locationNotice.textContent = message;
        locationNotice.hidden = false;
      }

      function fitSearchLocation() {
        if (!map || !searchLocation) return;
        const nearest = nearestProperties(searchLocation, visibleProperties);
        const bounds = buildBounds(nearest.map(item => item.property));
        bounds.extend({ lat: searchLocation.lat, lng: searchLocation.lng });
        lastVisibleBounds = bounds;
        savedMobileCamera = null;
        if (app.dataset.mobileView !== "list" || !isCompactMapView()) {
          map.fitBounds(bounds, { top: 70, right: 70, bottom: 70, left: 70 });
          google.maps.event.addListenerOnce(map, "idle", () => {
            if (map.getZoom() > 11) map.setZoom(11);
          });
        }
        updateSearchLocationNotice();
      }

      function updateSearchLocationNotice() {
        if (!searchLocation) return;
        const nearest = nearestProperties(searchLocation, visibleProperties);
        const state = stateSelect.value ? ` in ${STATE_NAMES[stateSelect.value]}` : "";
        announceLocation(nearest.length
          ? `Near ${searchLocation.label}. The closest matching property${state} is about ${Math.max(1, Math.round(nearest[0].miles))} miles away in a straight line. Your filters still apply; pan or zoom to explore more.`
          : `Found ${searchLocation.label}, but no properties match your filters${state}. Try another state, price, acreage, or status.`);
      }

      function normalizeCityName(value) {
        return normalizeSearchText(value).replace(/\bsaint\b/g, "st").replace(/^city of /, "").replace(/ city$/, "");
      }

      function findCity(query, cities, preferredState = "") {
        let name = normalizeSearchText(query).replace(/ (?:usa|us|united states)$/, "");
        let explicitState = "";
        const states = Object.entries(STATE_NAMES).sort((a, b) => b[1].length - a[1].length);
        for (const [code, label] of states) {
          const suffixes = [normalizeSearchText(label), code.toLowerCase()];
          const suffix = suffixes.find(part => name.endsWith(` ${part}`));
          if (!suffix) continue;
          explicitState = code;
          name = name.slice(0, -(suffix.length + 1)).trim();
          break;
        }
        const key = normalizeCityName(name);
        const matches = cities.filter(city => normalizeCityName(city[0]) === key && (!explicitState || city[1] === explicitState));
        // The index is ordered by population. A chosen state disambiguates a
        // same-name city when possible; an explicit city/state always wins.
        const city = (!explicitState && matches.find(item => item[1] === preferredState)) || matches[0];
        return city ? { lat: city[2], lng: city[3], label: `${city[0]}, ${city[1]}` } : null;
      }

      function loadCityIndex() {
        if (!cityIndexPromise) {
          cityIndexPromise = fetchWithTimeout(new URL("us-cities.json?v=20260912", window.location.href), { cache: "force-cache" })
            .then(text => {
              const data = JSON.parse(text);
              if (!Array.isArray(data.cities) || !data.cities.length) throw new Error("CITY_INDEX_UNAVAILABLE");
              return data.cities;
            }).catch(error => { cityIndexPromise = null; throw error; });
        }
        return cityIndexPromise;
      }

      async function searchNearby(query, requestId) {
        const key = normalizeSearchText(query);
        const preferredState = stateSelect.value;
        const lookupKey = `${key}|${preferredState}`;
        announceLocation(`Looking for ${query} and nearby properties…`);
        try {
          let location = locationCache.get(lookupKey);
          if (!location) {
            location = findCity(query, await loadCityIndex(), preferredState);
            if (!location) throw new Error("ZERO_RESULTS");
            if (locationCache.size >= 30) locationCache.delete(locationCache.keys().next().value);
            locationCache.set(lookupKey, location);
          }
          if (requestId !== searchRequestId || normalizeSearchText(searchInput.value) !== key) return;
          searchLocation = location;
          if (mapReady) {
          const pin = new PinClass({ background: "#2168b0", borderColor: "#134477", glyphColor: "#ffffff", glyphText: "●", scale: 1.1 });
          searchLocationMarker = new MarkerClass({ map, position: { lat: location.lat, lng: location.lng }, title: `Search location: ${location.label}`, content: pin, zIndex: 1000 });
          }
          refreshInventory({ preserveLocation: true });
        } catch (error) {
          if (requestId !== searchRequestId) return;
          const notFound = /ZERO_RESULTS/.test(String(error));
          announceLocation(notFound
            ? `We couldn’t find “${query}”. Try a city and state (for example, Santa Fe, NM), or search a property name. Smaller communities may not be included.`
            : "City search is temporarily unavailable. Search a property name or use the state and other filters to browse.");
          showState("empty", notFound ? "Location not found" : "No matching properties", "Use the state filter, or try a different search.");
        }
      }

      function sortProperties(items) {
        const mode = sortSelect.value;
        if (mode === "latest") {
          const now = Date.now();
          const day = property => verifiedDay(property.status === "sold" ? property.soldDate : property.publishedDate, now);
          return [...items].sort((a, b) => day(b) - day(a)
            || (a.status === "sold" ? -1 : 0) - (b.status === "sold" ? -1 : 0)
            || a.id.localeCompare(b.id));
        }

        const field = mode.startsWith("acres") ? "acres" : "price";
        const direction = mode.endsWith("desc") ? -1 : 1;

        return [...items].sort((a, b) => {
          const aValue = a[field];
          const bValue = b[field];
          const aHasValue = Number.isFinite(aValue);
          const bHasValue = Number.isFinite(bValue);
          if (aHasValue !== bHasValue) return aHasValue ? -1 : 1;
          if (aHasValue && bHasValue && aValue !== bValue) return (aValue - bValue) * direction;
          const statusDifference = STATUS_META[a.status].rank - STATUS_META[b.status].rank;
          if (statusDifference) return statusDifference;
          return a.title.localeCompare(b.title);
        });
      }

      function renderResults(items, { inView = false } = {}) {
        resultCount.textContent = `${items.length.toLocaleString()} ${items.length === 1 ? "property" : "properties"}${inView ? " in view" : ""}`;
        // Avoid rebuilding the hidden list on every map pan on phones.
        if (!mapUnavailable && isCompactMapView() && app.dataset.mobileView !== "list") {
          resultsDeferred = true;
          return;
        }
        resultsDeferred = false;
        const ordered = sortProperties(items);
        const signature = JSON.stringify([mapReady, sortSelect.value, selectedPropertyId,
          !properties.length && Boolean(geometryRequest || statusRequest), ordered.map(propertySignature)]);
        if (signature === renderedListSignature) return;
        renderedListSignature = signature;
        const previousCards = new Map([...resultsList.children].filter(card => card.dataset.propertyId)
          .map(card => [card.dataset.propertyId, card]));
        resultsList.replaceChildren();

        if (!items.length) {
          if (!properties.length) {
            const loading = Boolean(geometryRequest || statusRequest);
            const empty = createTextElement("div", "empty-results", loading
              ? "Loading properties…" : "The property list is temporarily unavailable. ");
            if (!loading) {
              const link = createTextElement("a", "", "Browse all properties →");
              link.href = "https://www.acretown.com/property/";
              link.target = "_blank"; link.rel = "noopener noreferrer";
              empty.appendChild(link);
            }
            resultsList.appendChild(empty);
            return;
          }
          const empty = createTextElement(
            "div",
            "empty-results",
            inView
              ? "No matching properties are visible here. Pan or zoom out to see more."
              : "No properties match these filters. Try a broader search, price range, acreage, or status."
          );
          resultsList.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        ordered.forEach(property => {
          const cardSignature = JSON.stringify([propertySignature(property), mapReady, property.id === selectedPropertyId]);
          const previous = previousCards.get(property.id);
          if (previous?.dataset.renderSignature === cardSignature) {
            fragment.appendChild(previous);
            return;
          }
          const card = document.createElement("article");
          card.className = "property-card";
          card.dataset.propertyId = property.id;
          card.dataset.renderSignature = cardSignature;
          if (property.id === selectedPropertyId) card.classList.add("is-active");

          const main = document.createElement(mapReady ? "button" : "a");
          main.className = "property-card-main";
          main.title = property.title;
          if (mapReady) main.type = "button";
          else { main.href = property.link; main.target = "_blank"; main.rel = "noopener noreferrer"; }
          main.setAttribute("aria-label", mapReady ? `Show ${property.title} on the map` : `View ${property.title}`);
          main.setAttribute("aria-pressed", String(property.id === selectedPropertyId));
          if (mapReady) main.addEventListener("click", () => {
            selectedPropertyId = property.id;
            setMobileView("map");
            requestAnimationFrame(() => openProperty(property, { focusMap: true, scrollCard: false }));
          });

          main.appendChild(makePropertyImage(property, "property-thumb"));
          const body = document.createElement("div");
          body.className = "property-card-body";
          const topLine = document.createElement("div");
          topLine.className = "card-topline";
          topLine.append(createPriceText(property, "span", "card-price"), createStatusBadge(property));
          const title = createTextElement("h3", "", propertyLocation(property));
          title.title = property.title;
          body.append(topLine, title);
          body.appendChild(createTextElement("p", "card-meta", propertyAcreage(property)));
          main.appendChild(body);
          card.appendChild(main);

          if (property.link) {
            const link = createTextElement("a", "card-link", "View property ↗");
            link.href = property.link;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            card.appendChild(link);
          }
          fragment.appendChild(card);
        });
        resultsList.appendChild(fragment);
      }

      function buildBounds(items) {
        const bounds = new google.maps.LatLngBounds();
        items.forEach(property => bounds.extend({ lat: property.lat, lng: property.lng }));
        return bounds;
      }

      function renderViewportResults() {
        if (!mapReady && searchLocation) {
          renderResults(nearestProperties(searchLocation, visibleProperties).map(item => item.property));
          return;
        }
        if (!mapReady || !visibleProperties.length) {
          renderResults(visibleProperties);
          return;
        }

        const currentZoom = map.getZoom() ?? 0;
        const bounds = map.getBounds();
        if (!bounds || (currentZoom <= 4.5 && !searchLocation)) {
          renderResults(visibleProperties);
          return;
        }

        const inView = visibleProperties.filter(property => bounds.contains({ lat: property.lat, lng: property.lng }));
        renderResults(inView, { inView: true });
      }

      function scheduleViewportResults() {
        window.clearTimeout(viewportListTimer);
        viewportListTimer = window.setTimeout(renderViewportResults, 140);
      }

      function markerCoordinates(marker) {
        const position = marker?.position;
        if (!position) return null;
        const lat = typeof position.lat === "function" ? position.lat() : Number(position.lat);
        const lng = typeof position.lng === "function" ? position.lng() : Number(position.lng);
        return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
      }

      function releaseTravelingClusterMarkers({ render = true } = {}) {
        if (!travelingClusterMarkers.length || !clusterer) return;
        const markers = travelingClusterMarkers;
        travelingClusterMarkers = [];
        markers.forEach(marker => { marker.map = null; });
        clusterer.addMarkers(markers, true);
        if (render) clusterer.render();
      }

      function showTravelingClusterMarkers(markers, targetMap) {
        releaseTravelingClusterMarkers();
        const uniqueMarkers = [...new Set(markers)].filter(Boolean);
        if (!uniqueMarkers.length) return;
        clusterer.removeMarkers(uniqueMarkers, true);
        uniqueMarkers.forEach(marker => { marker.map = targetMap; });
        travelingClusterMarkers = uniqueMarkers;
        clusterer.render();
      }

      function zoomLevelForBounds(bounds, targetMap, padding = 72) {
        const mapElement = targetMap.getDiv();
        const availableWidth = Math.max(mapElement.clientWidth - padding * 2, 256);
        const availableHeight = Math.max(mapElement.clientHeight - padding * 2, 256);
        const northEast = bounds.getNorthEast();
        const southWest = bounds.getSouthWest();
        const clampLatitude = latitude => Math.max(-85.05112878, Math.min(85.05112878, latitude));
        const worldY = latitude => {
          const sine = Math.sin(clampLatitude(latitude) * Math.PI / 180);
          return 0.5 - Math.log((1 + sine) / (1 - sine)) / (4 * Math.PI);
        };
        const longitudeFraction = Math.max((northEast.lng() - southWest.lng()) / 360, Number.EPSILON);
        const latitudeFraction = Math.max(Math.abs(worldY(northEast.lat()) - worldY(southWest.lat())), Number.EPSILON);
        const longitudeZoom = Math.log2(availableWidth / (256 * longitudeFraction));
        const latitudeZoom = Math.log2(availableHeight / (256 * latitudeFraction));
        return Math.max(2, Math.min(16, Math.floor(Math.min(longitudeZoom, latitudeZoom))));
      }

      function focusPropertyOnMap(property) {
        if (!map) return;

        const center = map.getCenter();
        const currentZoom = map.getZoom() ?? 4;
        const target = { lat: property.lat, lng: property.lng };
        const targetZoom = Math.min(17, Math.max(currentZoom, 13));
        const animationId = ++clusterAnimationId;

        showTravelingClusterMarkers([property.marker], map);

        const finish = () => {
          if (animationId !== clusterAnimationId) return;
          map.moveCamera({ center: target, zoom: targetZoom });
          releaseTravelingClusterMarkers();
          renderViewportResults();
          highlightPropertyCard(property, { scroll: !isCompactMapView() });
        };

        if (!center || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          finish();
          return;
        }

        const from = { lat: center.lat(), lng: center.lng() };
        const longitudeDistance = ((target.lng - from.lng + 540) % 360) - 180;
        const averageLatitude = (from.lat + target.lat) * Math.PI / 360;
        const geographicDistance = Math.hypot(
          target.lat - from.lat,
          longitudeDistance * Math.cos(averageLatitude)
        );
        const zoomDistance = Math.abs(targetZoom - currentZoom);
        const duration = Math.min(isCompactMapView() ? 520 : 650, 260 + zoomDistance * 25 + Math.min(100, geographicDistance * 1.5));
        const smootherStep = progress => progress * progress * progress
          * (progress * (progress * 6 - 15) + 10);
        let startTime;
        let lastFrame = -Infinity;

        const animate = timestamp => {
          if (animationId !== clusterAnimationId) return;
          startTime ??= timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);

          if (progress === 1 || timestamp - lastFrame >= CAMERA_FRAME_INTERVAL) {
            const centerProgress = smootherStep(Math.min(progress / 0.68, 1));
            const zoomTimeline = Math.max(0, Math.min(1, (progress - 0.06) / 0.94));
            const zoomProgress = smootherStep(zoomTimeline);
            map.moveCamera({
              center: {
                lat: from.lat + (target.lat - from.lat) * centerProgress,
                lng: from.lng + longitudeDistance * centerProgress
              },
              zoom: currentZoom + (targetZoom - currentZoom) * zoomProgress
            });
            lastFrame = timestamp;
          }

          if (progress < 1) window.requestAnimationFrame(animate);
          else finish();
        };

        window.requestAnimationFrame(animate);
      }

      function zoomIntoCluster(_event, clickedCluster, targetMap) {
        const clusterMarkers = [...new Set(clickedCluster?.markers ?? [])];
        const coordinates = clusterMarkers
          .map(markerCoordinates)
          .filter(Boolean);
        if (!coordinates.length) return;

        const clusterBounds = new google.maps.LatLngBounds();
        coordinates.forEach(position => clusterBounds.extend(position));
        const center = clusterBounds.getCenter();
        const centerLiteral = { lat: center.lat(), lng: center.lng() };
        const currentZoom = targetMap.getZoom() ?? 3;
        const boundsZoom = zoomLevelForBounds(clusterBounds, targetMap);
        const nextZoom = Math.min(Math.max(boundsZoom, Math.floor(currentZoom) + 1), 16);
        const animationId = ++clusterAnimationId;

        closePropertyDetails();
        showTravelingClusterMarkers(clusterMarkers, targetMap);

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const smootherStep = progress => progress * progress * progress
          * (progress * (progress * 6 - 15) + 10);
        const easeInOutSine = progress => -(Math.cos(Math.PI * progress) - 1) / 2;
        const startingCenter = targetMap.getCenter();

        if (prefersReducedMotion || !startingCenter) {
          targetMap.moveCamera({ center: centerLiteral, zoom: nextZoom });
          releaseTravelingClusterMarkers();
          return;
        }

        const from = { lat: startingCenter.lat(), lng: startingCenter.lng() };
        const longitudeDistance = ((centerLiteral.lng - from.lng + 540) % 360) - 180;
        const averageLatitude = (from.lat + centerLiteral.lat) * Math.PI / 360;
        const geographicDistance = Math.hypot(
          centerLiteral.lat - from.lat,
          longitudeDistance * Math.cos(averageLatitude)
        );
        const zoomDistance = Math.abs(nextZoom - currentZoom);
        const isLargeJump = zoomDistance >= 5;
        const shouldLeadTravel = geographicDistance >= 6;
        const cameraDuration = isLargeJump
          ? Math.min(isCompactMapView() ? 600 : 750, 320 + zoomDistance * 35)
          : Math.min(
              shouldLeadTravel ? 550 : 450,
              (shouldLeadTravel ? 260 : 220) + zoomDistance * 25 + geographicDistance * 1.5
            );
        let cameraStartTime;
        let lastCameraFrame = -Infinity;
        const animateCamera = timestamp => {
          if (animationId !== clusterAnimationId) return;
          cameraStartTime ??= timestamp;
          const progress = Math.min((timestamp - cameraStartTime) / cameraDuration, 1);
          if (progress === 1 || timestamp - lastCameraFrame >= CAMERA_FRAME_INTERVAL) {
            const zoomStart = shouldLeadTravel ? (isLargeJump ? 0.16 : 0.24) : 0;
            const zoomTimeline = Math.max(0, Math.min(1, (progress - zoomStart) / (1 - zoomStart)));
            const zoomProgress = isLargeJump ? easeInOutSine(zoomTimeline) : smootherStep(zoomTimeline);
            const centerProgress = shouldLeadTravel
              ? smootherStep(Math.min(progress / (isLargeJump ? 0.56 : 0.5), 1))
              : 1 - Math.pow(1 - zoomProgress, isLargeJump ? 2.5 : 3);
            targetMap.moveCamera({
              center: {
                lat: from.lat + (centerLiteral.lat - from.lat) * centerProgress,
                lng: from.lng + longitudeDistance * centerProgress
              },
              zoom: currentZoom + (nextZoom - currentZoom) * zoomProgress
            });
            lastCameraFrame = timestamp;
          }
          if (progress < 1) {
            window.requestAnimationFrame(animateCamera);
          } else {
            targetMap.moveCamera({ center: centerLiteral, zoom: nextZoom });
            releaseTravelingClusterMarkers();
            scheduleViewportResults();
          }
        };
        window.requestAnimationFrame(animateCamera);
      }

      function overviewPadding(height) {
        return height > 0 && height < 420
          ? { top: 44, right: 28, bottom: 28, left: 28 }
          : { top: 62, right: 62, bottom: 62, left: 62 };
      }

      function fitVisibleProperties() {
        if (!map || !visibleProperties.length || app.dataset.mobileView === "list") return;
        lastVisibleBounds = buildBounds(visibleProperties.filter(hasCoordinates));
        map.fitBounds(lastVisibleBounds, overviewPadding(map.getDiv?.()?.clientHeight));
        google.maps.event.addListenerOnce(map, "idle", () => {
          if (map.getZoom() > 11) map.setZoom(11);
        });
      }

      function showState(type, title, message) {
        mapState.hidden = false;
        stateSpinner.hidden = type !== "loading";
        retryButton.hidden = type !== "error";
        stateTitle.textContent = title;
        stateMessage.textContent = message;
      }

      function hideState() {
        mapState.hidden = true;
      }

      function refreshInventory({ fit = true, preserveLocation = false } = {}) {
        clusterAnimationId += 1;
        releaseTravelingClusterMarkers({ render: false });
        const min = Number(minPriceSelect.value);
        const max = maxPriceSelect.value === "Infinity" ? Infinity : Number(maxPriceSelect.value);
        if (min > max) {
          if (document.activeElement === minPriceSelect) maxPriceSelect.value = minPriceSelect.value;
          else minPriceSelect.value = maxPriceSelect.value;
        }

        const query = searchInput.value.trim();
        const requestId = ++searchRequestId;
        if (!preserveLocation) clearSearchLocation();
        visibleProperties = filteredInventory({ ignoreSearch: Boolean(searchLocation) });
        if (clusterer) {
          const next = new Set(visibleProperties.map(property => property.marker).filter(Boolean));
          const removed = [...renderedMarkers].filter(marker => !next.has(marker));
          const added = [...next].filter(marker => !renderedMarkers.has(marker));
          if (removed.length) clusterer.removeMarkers(removed, true);
          if (added.length) clusterer.addMarkers(added, true);
          if (removed.length || added.length) clusterer.render();
          renderedMarkers = next;
        }
        renderResults(visibleProperties);

        if (selectedPropertyId && !visibleProperties.some(property => property.id === selectedPropertyId)) {
          closePropertyDetails();
        }

        if (!mapReady) {
          if (searchLocation) { updateSearchLocationNotice(); renderViewportResults(); }
          else if (!visibleProperties.length && query.length >= 3) searchNearby(query, requestId);
          return;
        }
        if (searchLocation) {
          hideState();
          if (fit) fitSearchLocation();
          else updateSearchLocationNotice();
          renderViewportResults();
        } else if (!visibleProperties.length) {
          if (query.length >= 3) {
            hideState();
            searchNearby(query, requestId);
          } else {
            showState("empty", "No matching properties", "Adjust the filters or search to bring properties back into view.");
          }
        } else {
          hideState();
          if (fit) fitVisibleProperties();
        }
      }

      function setMobileView(view) {
        if (mapUnavailable) view = "list";
        const isMobile = window.matchMedia("(max-width: 820px)").matches;
        if (isMobile && view === "list" && map) {
          const center = map.getCenter();
          const zoom = map.getZoom();
          if (center && Number.isFinite(zoom)) {
            savedMobileCamera = {
              center: { lat: center.lat(), lng: center.lng() },
              zoom
            };
          }
        }

        app.dataset.mobileView = view;
        const mapSelected = view === "map";
        mapTab.setAttribute("aria-selected", String(mapSelected));
        listTab.setAttribute("aria-selected", String(!mapSelected));
        document.getElementById("map-panel").hidden = mapUnavailable || (!mapSelected && isMobile);
        document.getElementById("results-panel").hidden = !mapUnavailable && mapSelected && isMobile;
        if (!mapSelected && resultsDeferred) renderViewportResults();
        if (mapSelected && map) {
          requestAnimationFrame(() => {
            google.maps.event.trigger(map, "resize");
            if (savedMobileCamera) map.moveCamera(savedMobileCamera);
            else if (searchLocation) fitSearchLocation();
            clusterer?.render();
          });
        } else if (isMobile && selectedPropertyId) {
          requestAnimationFrame(() => {
            resultsList.querySelector(`[data-property-id="${selectedPropertyId}"]`)
              ?.scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
        }
      }

      function syncResponsivePanels() {
        if (mapUnavailable) {
          document.getElementById("map-panel").hidden = true;
          document.getElementById("results-panel").hidden = false;
          if (resultsDeferred) renderViewportResults();
          return;
        }
        const isMobile = window.matchMedia("(max-width: 820px)").matches;
        document.getElementById("map-panel").hidden = isMobile && app.dataset.mobileView !== "map";
        document.getElementById("results-panel").hidden = isMobile && app.dataset.mobileView !== "list";
        if (!isMobile) {
          document.getElementById("map-panel").hidden = false;
          document.getElementById("results-panel").hidden = false;
          if (resultsDeferred) renderViewportResults();
          if (map) google.maps.event.trigger(map, "resize");
        }
        syncPropertyDetailsSurface();
      }

      function redrawMapAfterTabReturn() {
        if (!map || document.hidden) return;
        const mapPanel = document.getElementById("map-panel");
        if (mapPanel.hidden || mapPanel.getClientRects().length === 0) return;

        google.maps.event.trigger(map, "resize");
        const center = map.getCenter();
        const zoom = map.getZoom();
        if (center && Number.isFinite(zoom)) {
          map.moveCamera({
            center: { lat: center.lat(), lng: center.lng() },
            zoom
          });
        }
        clusterer?.render();
      }

      function wakeMapAfterTabReturn() {
        if (document.hidden) return;
        requestAnimationFrame(redrawMapAfterTabReturn);
        window.clearTimeout(mapWakeTimer);
        mapWakeTimer = window.setTimeout(redrawMapAfterTabReturn, 220);
      }

      function updateMobileFilterLabel() {
        const count = [
          Boolean(stateSelect.value),
          minPriceSelect.value !== "0",
          maxPriceSelect.value !== "Infinity",
          acreageSelect.value !== "any"
        ].filter(Boolean).length;
        mobileFilterLabel.textContent = count ? `Filters (${count})` : "Filters";
      }

      function wireControls() {
        document.getElementById("explorer-fit").addEventListener("click", () => {
          if (!mapReady) return;
          setMobileView("map");
          requestAnimationFrame(() => {
            closePropertyDetails();
            if (searchLocation) fitSearchLocation();
            else fitVisibleProperties();
          });
        });
        document.getElementById("explorer-filter-panel").addEventListener("keydown", event => {
          if (event.key !== "Escape") return;
          app.dataset.mobileFilters = "closed";
          mobileFilterToggle.setAttribute("aria-expanded", "false");
          mobileFilterSymbol.textContent = "+";
          mobileFilterToggle.focus();
        });
        app.dataset.mobileFilters = "closed";
        mobileFilterToggle.addEventListener("click", () => {
          const expanded = app.dataset.mobileFilters !== "open";
          app.dataset.mobileFilters = expanded ? "open" : "closed";
          mobileFilterToggle.setAttribute("aria-expanded", String(expanded));
          mobileFilterSymbol.textContent = expanded ? "−" : "+";
        });
        updateMobileFilterLabel();
        searchInput.addEventListener("input", () => {
          window.clearTimeout(searchTimer);
          searchRequestId += 1;
          clearSearchLocation();
          searchTimer = window.setTimeout(() => refreshInventory(), 650);
        });
        searchInput.addEventListener("keydown", event => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          window.clearTimeout(searchTimer);
          refreshInventory();
        });
        const refreshFilters = () => {
          window.clearTimeout(searchTimer);
          refreshInventory({ preserveLocation: Boolean(searchLocation) });
          updateMobileFilterLabel();
        };
        document.querySelectorAll("[data-status-filter]").forEach(input => input.addEventListener("change", refreshFilters));
        stateSelect.addEventListener("change", refreshFilters);
        minPriceSelect.addEventListener("change", refreshFilters);
        maxPriceSelect.addEventListener("change", refreshFilters);
        acreageSelect.addEventListener("change", refreshFilters);
        sortSelect.addEventListener("change", renderViewportResults);
        resetButton.addEventListener("click", () => {
          const resetScrollPosition = { left: window.scrollX, top: window.scrollY };
          window.clearTimeout(searchTimer);
          searchInput.value = "";
          stateSelect.value = "";
          savedMobileCamera = null;
          minPriceSelect.value = "0";
          maxPriceSelect.value = "Infinity";
          acreageSelect.value = "any";
          updateMobileFilterLabel();
          sortSelect.value = "latest";
          document.querySelector('[data-status-filter][value="available"]').checked = true;
          document.querySelector('[data-status-filter][value="pending"]').checked = true;
          document.querySelector('[data-status-filter][value="sold"]').checked = true;
          refreshInventory();
          requestAnimationFrame(() => window.scrollTo(resetScrollPosition.left, resetScrollPosition.top));
          window.setTimeout(() => window.scrollTo(resetScrollPosition.left, resetScrollPosition.top), 350);
        });
        retryButton.addEventListener("click", () => window.location.reload());
        mapTab.addEventListener("click", () => setMobileView("map"));
        listTab.addEventListener("click", () => setMobileView("list"));
        mobilePropertyClose.addEventListener("click", () => closePropertyDetails());
        window.addEventListener("resize", syncResponsivePanels, { passive: true });
        document.addEventListener("visibilitychange", wakeMapAfterTabReturn, { passive: true });
        window.addEventListener("pageshow", wakeMapAfterTabReturn, { passive: true });
        window.addEventListener("focus", wakeMapAfterTabReturn, { passive: true });
      }

      function enterListFallback(message) {
        mapUnavailable = true;
        mapReady = false;
        app.dataset.mapUnavailable = "true";
        mapServiceNotice.textContent = message || "The map is temporarily unavailable. Browse the property list below.";
        mapServiceNotice.hidden = false;
        mapTab.disabled = true;
        setMobileView("list");
        renderViewportResults();
      }

      function loadClusterLibrary() {
        return new Promise((resolve, reject) => {
          if (window.markerClusterer?.MarkerClusterer) { resolve(true); return; }
          const script = document.createElement("script");
          const timer = window.setTimeout(() => { script.remove(); reject(new Error("Map library timed out.")); }, SOURCE_TIMEOUT_MS);
          script.src = "https://unpkg.com/@googlemaps/markerclusterer@2.6.2/dist/index.min.js";
          script.async = true;
          script.onload = () => { window.clearTimeout(timer); resolve(Boolean(window.markerClusterer?.MarkerClusterer)); };
          script.onerror = () => { window.clearTimeout(timer); reject(new Error("Map library unavailable.")); };
          document.head.appendChild(script);
        });
      }

      window.initMap = async function initMap() {
        try {
          if (!await clusterLibraryPromise) throw new Error("Map library unavailable.");
          map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 38.5, lng: -98.5 }, zoom: 4, minZoom: 2, mapId: MAP_ID,
            renderingType: google.maps.RenderingType.VECTOR, isFractionalZoomEnabled: true,
            backgroundColor: "#edf5f0", streetViewControl: false, mapTypeControl: true,
            mapTypeControlOptions: { style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR, position: google.maps.ControlPosition.TOP_LEFT },
            fullscreenControl: true, clickableIcons: false
          });
          google.maps.event.addListenerOnce(map, "tilesloaded", () => {
            app.dataset.mapRenderingType = String(map.getRenderingType() ?? "unknown").toLowerCase();
          });
          const markerLibrary = await google.maps.importLibrary("marker");
          MarkerClass = markerLibrary.AdvancedMarkerElement;
          PinClass = markerLibrary.PinElement;
          const geometryLoaded = await inventoryLoad;
          if (!geometryLoaded || !properties.some(hasCoordinates)) throw new Error("Property locations unavailable.");
          properties.forEach(createMarker);
          clusterer = new window.markerClusterer.MarkerClusterer({
            map, markers: [],
            renderer: {
              render({ count, position }) {
                const badge = createTextElement("div", "explorer-cluster", String(count));
                return new MarkerClass({ position, content: badge, gmpClickable: true,
                  title: count + " properties — select to explore", zIndex: 1000 + count });
              }
            },
            onClusterClick: zoomIntoCluster
          });
          renderedMarkers = new Set();
          map.addListener("idle", scheduleViewportResults);
          mapReady = true; mapUnavailable = false; app.dataset.mapUnavailable = "false";
          mapServiceNotice.hidden = true; mapTab.disabled = false;
          window.clearTimeout(mapLoadTimer);
          syncResponsivePanels();
          refreshInventory();
        } catch (error) {
          console.error("Property map initialization failed:", error);
          enterListFallback();
        }
      };

      window.handleMapLoadError = () => enterListFallback();
      window.gm_authFailure = () => enterListFallback();

      function startApplication() {
        configureStateFilter();
        configurePriceFilters();
        wireControls();
        syncResponsivePanels();
        // Data and controls do not depend on either Google Maps library.
        inventoryLoad = refreshMapGeometry();
        refreshAuthoritativeStatus();
        clusterLibraryPromise = loadClusterLibrary().catch(() => { enterListFallback(); return false; });
        mapLoadTimer = window.setTimeout(() => {
          if (!mapReady) enterListFallback("The map is taking longer to load. Browse the property list while we connect.");
        }, MAP_TIMEOUT_MS);
        window.setInterval(refreshMapSources, STATUS_REFRESH_MS);
        window.setInterval(() => {
          if ((availabilityWasFresh && !snapshotIsFresh(statusSnapshot)) || Date.now() >= nextMetadataExpiry) applyCurrentAvailability();
        }, 1000);
        document.addEventListener("visibilitychange", refreshMapSources);
        window.addEventListener("pageshow", refreshMapSources);
      }
      startApplication();
    })();
  </script>

    onerror="handleMapLoadError()">
  </script>
